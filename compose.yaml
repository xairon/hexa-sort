services:
  hexa:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Change when using a reverse proxy, e.g. https://hexa.example.com
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    volumes:
      - hexa-data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
volumes:
  hexa-data:
