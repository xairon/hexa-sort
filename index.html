      out.lowFx = !!d.lowFx;
      if (DIFFICULTIES[d.current]) out.current = d.current;
      for (const k of DIFF_ORDER) out.progress[k] = cleanProgress(d.progress && d.progress[k], DIFFICULTIES[k].radius);
      for (const k of MODE_ORDER) out.special[k] = cleanSpecial(d.special && d.special[k]);
      return out;
    }
    for (const k of MODE_ORDER) out.special[k] = cleanSpecial(null);
    // Première ouverture sans V4 : la progression de la V3 devient celle du mode Normal
    for (const k of DIFF_ORDER) out.progress[k] = freshProgress();
    const v3 = readJSON(V3_KEY);
    if (v3) {
      out.muted = !!v3.muted;
      out.progress.normal = cleanProgress(v3, DIFFICULTIES.normal.radius);
    }
    return out;
  }
  const save = loadSave();
  state.diff = save.current;
  gridRadius = diff().radius;
  const prog = () => save.progress[state.diff];
  // Emplacement de sauvegarde de la partie en cours : progression du niveau ou mode spécial
  const slot = () => (isSpecial() ? save.special[state.mode] : prog());

  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) { /* stockage indisponible */ }
  }

  /** Le record du Défi du jour repart de zéro chaque jour. */
  function ensureDaily() {
    const s = save.special.daily;
    if (s.date === todayKey()) return;
    s.date = todayKey();
    s.best = 0;
    s.bestCombo = 0;
    s.game = null;
    persist();
  }

  /** Photographie la partie en cours (appelé uniquement entre deux coups, plateau stable). */
  function saveGame() {
    if (state.mode === 'chrono') return; // une partie chronométrée ne se met pas en pause d'une session à l'autre
    slot().game = {
      level: state.level,
      score: state.score,
      cells: state.cells.map(c => c.stack.slice()),
      dock: state.dock.map(d => (d ? d.stack.slice() : null)),
      hammers: state.hammers,
      rerolls: state.rerolls,
      fever: state.fever,
      bestCombo: state.levelBestCombo,
      movesLeft: state.movesLeft,
      turn: state.turn,
      rocks: state.cells.map((c, i) => (c.rock ? i : -1)).filter(i => i >= 0),
      rocksHp: state.cells.filter(c => c.rock).map(c => c.rockHp || 1),
      nextRockTurn: state.nextRockTurn,
      rngState,
    };
    persist();
  }

  function clearGame() {
    slot().game = null;
    persist();
  }

  function recordWin() {
    const b = prog().best[state.level] || { combo: 0, score: 0 };
    b.combo = Math.max(b.combo || 0, state.levelBestCombo);
    b.score = Math.max(b.score || 0, state.score);
    prog().best[state.level] = b;
    prog().unlocked = Math.max(prog().unlocked, state.level + 1);
    prog().game = null;
    persist();
  }

  // Étoiles d'un niveau gagné, selon le meilleur combo réalisé dedans
  const starsFor = n => {
    const b = prog().best[n];
    if (!b) return 0;
    return b.combo >= 7 ? 3 : b.combo >= 5 ? 2 : 1;
  };

  function buildBoard() {
    state.cells = [];
    state.cellMap.clear();
    const R = gridRadius;
    for (let q = -R; q <= R; q++) {
      for (let r = Math.max(-R, -q - R); r <= Math.min(R, -q + R); r++) {
        const cell = { q, r, stack: [], incoming: 0, cx: 0, cy: 0, nb: [], placedAt: -1e9, squashAt: -1e9, pulseAt: -1e9 };
        state.cells.push(cell);
        state.cellMap.set(cellKey(q, r), cell);
      }
    }
    for (const c of state.cells) {
      c.nb = DIRS.map(([dq, dr]) => state.cellMap.get(cellKey(c.q + dq, c.r + dr))).filter(Boolean);
    }
  }

  // Objectifs : forte montée sur les 10 premiers niveaux, puis +100 par niveau jusqu'à un plafond,
  // pour que les centaines de niveaux suivants restent jouables. Ajustés par la difficulté.
  const GOAL_CAP = 10000;
  const goalFor = level => {
    const raw = level <= 10 ? 800 + (level - 1) * 600 : 6200 + (level - 10) * 100;
    return Math.max(100, Math.round(Math.min(GOAL_CAP, raw) * diff().goalFactor / 50) * 50);
  };
  const colorsFor = level => rules().colors(level);

  /**
   * Génère une pile (bas -> haut).
   * Les couleurs sont tirées du sommet vers le bas pour pouvoir imposer la couleur du sommet.
   */
  function genStack(minT, maxT, nColors, preferTop = null) {
    const total = randInt(minT, maxT);
    const rl = rand();
    const layers = Math.min(total, rl < 0.4 ? 1 : rl < 0.8 ? 2 : 3);
    const sizes = new Array(layers).fill(1);
    for (let k = layers; k < total; k++) sizes[randInt(0, layers - 1)]++;

    const colorsTopDown = [];
    for (let i = 0; i < layers; i++) {
      let c;
      if (i === 0 && preferTop !== null) {
        c = preferTop;
      } else {
        do { c = randInt(0, nColors - 1); } while (i > 0 && c === colorsTopDown[i - 1]);
      }
      colorsTopDown.push(c);
    }
    const stack = [];
    for (let i = layers - 1; i >= 0; i--) {
      for (let k = 0; k < sizes[i]; k++) stack.push(colorsTopDown[i]);
    }
    return stack;
  }

  /** Pré-remplit ~60 % du plateau (haut et côtés), sans voisins de même couleur au sommet. */
  function prefill() {
    const nColors = colorsFor(state.level);
    const target = Math.round(state.cells.length * rules().prefill);
    const scored = state.cells.map(c => {
      const nx = c.q / gridRadius;
      const ny = (c.r + c.q / 2) / gridRadius; // -1 = haut, +1 = bas
      let w = -ny * 1.25 + Math.abs(nx) * 0.9 + rand() * 0.7;
      if (c.q === 0 && c.r === 0) w -= 10;      // le centre reste libre
      return { c, w };
    }).sort((a, b) => b.w - a.w);

    let filled = 0;
    for (const { c } of scored) {
      if (filled >= target) break;
      const avoid = c.nb.filter(n => n.stack.length).map(n => topColor(n.stack));
      const allowed = [];
      for (let k = 0; k < nColors; k++) if (!avoid.includes(k)) allowed.push(k);
      if (!allowed.length) continue;
      c.stack = genStack(2, 6, nColors, rpick(allowed));
      filled++;
    }
  }

  /**
   * Pile du dock : jamais plus de DOCK_MAX_RUN jetons de la même couleur à la suite, pour qu'il
   * faille calculer où la poser. 2 à 7 jetons répartis sur 1 à 4 couches de couleurs alternées ;
   * une pile d'une seule couleur n'arrive donc que si elle est petite (3 jetons au plus).
   */
  function genDockStack(nColors, preferTop = null) {
    const total = randInt(2, 7);
    const minLayers = Math.ceil(total / DOCK_MAX_RUN);
    const layers = randInt(Math.max(minLayers, total >= 4 ? 2 : 1), Math.min(4, total));
    const sizes = new Array(layers).fill(1);
    for (let left = total - layers; left > 0; left--) {
      const open = sizes.map((v, i) => i).filter(i => sizes[i] < DOCK_MAX_RUN);
      sizes[rpick(open)]++;
    }
    // Couleurs du sommet vers le bas, deux couches voisines toujours différentes
    const colorsTopDown = [];
    for (let i = 0; i < layers; i++) {
      let c = i === 0 && preferTop !== null ? preferTop : randInt(0, nColors - 1);
      if (i > 0 && c === colorsTopDown[i - 1]) c = (c + 1 + randInt(0, nColors - 2)) % nColors;
      colorsTopDown.push(c);
    }
    const stack = [];
    for (let i = layers - 1; i >= 0; i--) {
      for (let k = 0; k < sizes[i]; k++) stack.push(colorsTopDown[i]);
    }
    return stack;
  }

  function refillDock() {
    const nColors = colorsFor(state.level);
    const boardTops = [...new Set(state.cells.filter(c => c.stack.length).map(c => topColor(c.stack)))];
    const t = now;
    // En mode à coups comptés, le dock ne propose jamais plus de piles qu'il n'en reste à poser
    const count = rules().moves ? Math.min(3, state.movesLeft) : 3;
    const tops = [];
    for (let i = 0; i < 3; i++) {
      if (i >= count) { state.dock[i] = null; continue; }
      // Moins collé aux couleurs du plateau qu'avant (0,6), et jamais la même couleur suggérée deux fois
      const choices = boardTops.filter(c => !tops.includes(c));
      let prefer = choices.length && rand() < 0.45 ? rpick(choices) : null;
      let stack = genDockStack(nColors, prefer);
      // Les 3 piles n'ont jamais toutes la même couleur au sommet
      for (let tries = 0; i === 2 && tops[0] === tops[1] && topColor(stack) === tops[0] && tries < 20; tries++) {
        stack = genDockStack(nColors, null);
      }
      tops.push(topColor(stack));
      state.dock[i] = { stack, born: t + i * 110 };
    }
    if (count) Sfx.deal();
  }

  function startLevel(level, persistIt = true) {
    state.gen++;
    state.levelBestCombo = 0;
    flyers.length = 0;
    timers.length = 0;
    drag = null; hoverCell = null; hammerFx = null;
    if (state.mode === 'daily') rngState = dailySeed();
    state.level = level;
    state.goal = isSpecial() ? Infinity : goalFor(level);
    state.score = 0;
    state.displayScore = 0;
    // Préférence « Sans outils » : appliquée à chaque nouvelle partie
    state.hammers = save.noTools ? 0 : rules().tools;
    state.rerolls = save.noTools ? 0 : rules().tools;
    state.turn = 0;
    state.lastShrinkTurn = 0;
    state.nextRockTurn = rockInterval(0);
    state.movesLeft = rules().moves || 0;
    state.timeLeft = (rules().time || 0) * 1000;
    state.busy = false;
    state.over = false;
    state.combo = 0;
    state.comboShowUntil = 0;
    state.fever = 0;
    state.feverOn = false;
    state.slowUntil = 0;
    state.flash = null;
    orbs.length = 0;
    particles.length = 0;
    topParticles.length = 0;
    rays.length = 0;
    banners.length = 0;
    document.body.classList.remove('fever');
    for (const c of state.cells) { c.stack = []; c.incoming = 0; c.rock = false; c.rockHp = 0; c.rockAt = -1e9; c.crackAt = -1e9; }
    prefill();
    refillDock();
    hideModal();
    setHammerMode(false);
    updateTools();
    hudCache = '';
    if (persistIt) saveGame();
  }

  /** Reprend une partie sauvegardée : même plateau, même dock, mêmes outils. */
  function restoreGame(g) {
    startLevel(g.level, false);
    state.cells.forEach((c, i) => { c.stack = g.cells[i].slice(); });
    state.dock = g.dock.map((s, i) => (s && s.length ? { stack: s.slice(), born: now + i * 110 } : null));
    if (state.dock.every(d => !d)) refillDock();
    state.score = state.displayScore = Math.max(0, Math.floor(Number(g.score)) || 0);
    state.hammers = clamp(Math.floor(Number(g.hammers)) || 0, 0, 9);
    state.rerolls = clamp(Math.floor(Number(g.rerolls)) || 0, 0, 9);
    state.fever = clamp(Math.floor(Number(g.fever)) || 0, 0, FEVER_TURNS);
    state.levelBestCombo = Math.max(0, Math.floor(Number(g.bestCombo)) || 0);
    if (isSpecial()) {
      state.movesLeft = clamp(Math.floor(Number(g.movesLeft)) || 0, 0, 999);
      state.turn = Math.max(0, Math.floor(Number(g.turn)) || 0);
      state.lastShrinkTurn = state.turn;
      // Sauvegardes V5/V5.1 : pas de prochain rocher ni de solidité enregistrés
      const next = Math.floor(Number(g.nextRockTurn));
      state.nextRockTurn = next > state.turn ? next : state.turn + rockInterval(state.turn);
      const hps = Array.isArray(g.rocksHp) ? g.rocksHp : [];
      (Array.isArray(g.rocks) ? g.rocks : []).forEach((i, k) => {
        if (!state.cells[i]) return;
        state.cells[i].rock = true;
        state.cells[i].rockHp = hps[k] === 2 ? 2 : 1;
      });
      if (Number.isInteger(g.rngState)) rngState = g.rngState;
    }
    updateTools();
    hudCache = '';
  }

  /* =====================================================================
   * Effets : particules, anneaux, textes flottants
   * ===================================================================== */
  function burst(x, y, colorIdx, n = 10, power = 1) {
    if (save.lowFx) n = Math.ceil(n * 0.3); // effets réduits : 70 % de particules en moins
    const P = colorIdx === null ? null : PALETTE[colorIdx];
    const k = L.hex / 40;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (120 + Math.random() * 260) * k * power;
      const life = 0.45 + Math.random() * 0.5;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp * 0.8 - 160 * k * power,
        g: 900 * k, life, max: life,
        size: (2.5 + Math.random() * 3.5) * k,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14,
        color: P ? pick([P.top, P.top, P.light, '#ffffff']) : pick(['#ffffff', '#ffe066', '#c4b5fd']),
      });
    }
  }

  function confetti() {
    for (let i = 0; i < 110; i++) {
      const life = 1.4 + Math.random() * 1.2;
      particles.push({
        x: Math.random() * W, y: -20 - Math.random() * H * 0.3,
        vx: (Math.random() - 0.5) * 120, vy: 80 + Math.random() * 160,
        g: 120, life, max: life,
        size: 4 + Math.random() * 5,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10,
        color: pick(PALETTE).top,
      });
    }
  }

  function ring(x, y, color, size = 1) {
    rings.push({ x, y, life: 0.45, max: 0.45, color: color || 'rgba(255,255,255,1)', size });
  }

  function floatText(x, y, text, color, size) {
    floats.push({ x, y, text, color, size: size || L.hex * 0.75, life: 1.15, max: 1.15 });
  }

  /* ---------------- Combo, fièvre, ralenti, flash (V2) ---------------- */
  const comboMult = () => Math.min(10, 1 + Math.floor((state.combo - 1) / 2));
  const comboColor = n => COMBO_COLORS[Math.min(COMBO_COLORS.length - 1, Math.max(0, Math.floor((n - 2) / 2)))];

  function buzz(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (_) { /* non supporté */ }
  }
  function slowMo(ms) { state.slowUntil = performance.now() + ms; }
  function flash(color, dur) { state.flash = { color, dur, t0: performance.now() }; }
  function banner(text, color, size = 1) { banners.push({ text, color, size, t0: now, dur: 1400 }); }

  /** Une étape de cascade (transfert ou collecte) vient d'avoir lieu. */
  function comboStep(cell) {
    state.combo++;
    state.comboPopAt = now;
    state.comboShowUntil = Infinity;
    if (state.combo >= 2) {
      Sfx.comboTick(state.combo);
      state.shake = Math.max(state.shake, Math.min(8, 1 + state.combo * 0.7));
      if (cell) burst(cell.cx, cell.cy - cell.stack.length * L.th, null, 4 + state.combo, 0.6);
    }
    if (state.combo === FEVER_AT && !state.feverOn) startFever();
  }

  function startFever() {
    state.fever = FEVER_TURNS;
    state.feverOn = true;
    document.body.classList.add('fever');
    banner('FIÈVRE ×2 !', '#ff6bd5', 1.15);
    flash('rgba(255, 120, 220, 1)', 420);
    Sfx.fever();
    buzz([20, 30, 20]);
  }

  /** Bilan de fin de cascade : bannière selon la longueur de la chaîne. */
  function finishCombo() {
    const n = state.combo;
    state.levelBestCombo = Math.max(state.levelBestCombo, n);
    if (n >= 2) state.comboShowUntil = now + 1600;
    let label = null;
    if (n >= 10) label = 'LÉGENDAIRE !';
    else if (n >= 7) label = 'INCROYABLE !';
    else if (n >= 5) label = 'GÉNIAL !';
    else if (n >= 3) label = 'SUPER !';
    if (!label) return;
    banner(label, comboColor(n), n >= 7 ? 1.2 : 1);
    if (n >= 7) { Sfx.win(); buzz([40, 50, 80]); }
  }

  /* ---------------- Jetons collectés qui volent vers la jauge ---------------- */
  let gaugeRect = null;
  function gaugeTarget() {
    if (!gaugeRect) return { x: W / 2, y: 30 };
    return {
      // En mode spécial il n'y a pas d'objectif : les jetons visent le milieu du compteur de score
      x: gaugeRect.left + gaugeRect.width * (isSpecial() ? 0.5 : clamp(state.displayScore / state.goal, 0.02, 1)),
      y: gaugeRect.top + gaugeRect.height / 2,
    };
  }

  function spawnOrb(x, y, color, value, i) {
    orbs.push({
      x0: x, y0: y, x, y, color, value, i,
      cx: x + (Math.random() - 0.5) * L.hex * 5,
      cy: y - L.hex * (1.5 + Math.random() * 2.5),
      t0: now + 60 + i * 18, dur: 560 + Math.random() * 200,
      trail: [],
    });
  }

  function updateOrbs() {
    const g = gaugeTarget();
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      const t = (now - o.t0) / o.dur;
      if (t < 0) continue;
      if (t >= 1) {
        orbs.splice(i, 1);
        state.score += o.value;
        gaugeHit(g.x, g.y, o.color, o.i);
        continue;
      }
      // Bézier quadratique, accélération vers la jauge
      const e = t * t, u = 1 - e;
      o.x = u * u * o.x0 + 2 * u * e * o.cx + e * e * g.x;
      o.y = u * u * o.y0 + 2 * u * e * o.cy + e * e * g.y;
      o.trail.push({ x: o.x, y: o.y });
      if (o.trail.length > 10) o.trail.shift();
    }
  }

  function bumpGauge() {
    const el = $('progBox');
    el.classList.remove('bump');
    void el.offsetWidth; // relance l'animation CSS
    el.classList.add('bump');
  }

  function gaugeHit(x, y, color, i) {
    const P = PALETTE[color];
    for (let k = 0; k < 5; k++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 160;
      const life = 0.35 + Math.random() * 0.3;
      topParticles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, g: 300, life, max: life,
        size: 2 + Math.random() * 3, rot: Math.random() * 6, vr: 8,
        color: pick([P.light, '#ffffff', '#ffe066']),
      });
    }
    bumpGauge();
    if (i % 2 === 0) Sfx.orb(i);
  }

  function stepParticles(list, dt) {
    for (let i = list.length - 1; i >= 0; i--) {
      const p = list[i];
      p.vy += p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.life -= dt;
      if (p.life <= 0) list.splice(i, 1);
    }
  }

  function updateFx(dt) {
    stepParticles(topParticles, dt);
    // Braises qui montent pendant la fièvre
    if (state.feverOn && !save.lowFx && Math.random() < dt * 30) {
      const life = 1.4 + Math.random();
      particles.push({
        x: Math.random() * W, y: H + 5, vx: (Math.random() - 0.5) * 30, vy: -(90 + Math.random() * 140),
        g: -15, life, max: life, size: 2 + Math.random() * 3, rot: 0, vr: 3,
        color: `hsl(${Math.floor(now / 8 + Math.random() * 80) % 360}, 95%, 65%)`,
      });
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].life -= dt;
      if (rings[i].life <= 0) rings.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.y -= 55 * dt * (L.hex / 40);
      f.life -= dt;
      if (f.life <= 0) floats.splice(i, 1);
    }
    state.shake = Math.max(0, state.shake - dt * 40);
  }

  /* =====================================================================
   * Jetons volants (sauts paraboliques avec retournement)
   * ===================================================================== */
  function updateFlyers() {
    const t = now;
    for (let i = 0; i < flyers.length; i++) {
      const f = flyers[i];
      if (!f.started && t >= f.start) {
        f.started = true;
        f.src.stack.pop();
        f.sz = f.src.stack.length;
        f.tz = f.dst.stack.length + f.dst.incoming;
        f.dst.incoming++;
        Sfx.jump(state.noteIdx++);
      }
    }
    for (let i = flyers.length - 1; i >= 0; i--) {
      const f = flyers[i];
      if (f.started && t >= f.start + f.dur) {
        f.dst.stack.push(f.color);
        f.dst.incoming--;
        f.dst.squashAt = t;
        burst(f.dst.cx, f.dst.cy - f.dst.stack.length * L.th, f.color, 3, 0.4);
        flyers.splice(i, 1);
        Sfx.land();
        f.resolve();
      }
    }
  }

  function flyerPose(f) {
    const t = clamp((now - f.start) / f.dur, 0, 1);
    const e = easeInOutQuad(t);
    const sx = f.src.cx, sy = f.src.cy - f.sz * L.th;
    const tx = f.dst.cx, ty = f.dst.cy - f.tz * L.th;
    const dist = Math.hypot(tx - sx, ty - sy);
    const arc = L.hex * 1.1 + dist * 0.35;
    return {
      x: lerp(sx, tx, e),
      y: lerp(sy, ty, e) - Math.sin(Math.PI * e) * arc,
      e,
      ang: Math.atan2(ty - sy, tx - sx),
    };
  }

  /** Transfère tous les jetons de la couleur du sommet de src vers dst, un par un. */
  function transfer(src, dst, chain) {
    const color = topColor(src.stack);
    const n = topRun(src.stack);
    const t0 = now;
    const all = [];
    for (let i = 0; i < n; i++) {
      all.push(new Promise(resolve => {
        flyers.push({
          src, dst, color, resolve,
          start: t0 + i * FLY_STAGGER, dur: FLY_DURATION,
          started: false, sz: 0, tz: 0,
        });
      }));
    }
    return Promise.all(all).then(() => sleep(70));
  }

  /** Collecte la couche supérieure (10+) jeton par jeton avec explosion de particules. */
  async function collect(cell, gen) {
    const color = topColor(cell.stack);
    const k = topRun(cell.stack);
    comboStep(cell);
    const mult = comboMult() * (state.feverOn ? 2 : 1);
    const per = POINTS_PER_TOKEN * mult;
    const epic = k >= 15 || state.combo >= 4;
    cell.pulseAt = now;
    if (epic) { slowMo(520); Sfx.impact(); }

    // Chaque jeton saute de la pile et s'envole vers la jauge (le score monte à l'arrivée)
    for (let i = 0; i < k; i++) {
      const y = cell.cy - cell.stack.length * L.th;
      cell.stack.pop();
      cell.squashAt = now;
      burst(cell.cx, y, color, 7);
      if (save.lowFx) state.score += per; // effets réduits : pas de jetons volants vers la jauge
      else spawnOrb(cell.cx, y, color, per, i);
      Sfx.pop(i);
      state.shake = Math.max(state.shake, 3);
      await sleep(40);
      if (gen !== state.gen) return;
    }

    const pts = k * per;
    const topY = cell.cy - cell.stack.length * L.th;
    // Survie : une collecte brise les rochers voisins
    for (const n of cell.nb) if (n.rock) breakRock(n, true);
    // Chrono : chaque collecte rajoute du temps
    if (state.mode === 'chrono' && !state.over) {
      state.timeLeft += CHRONO_BONUS;
      floatText(cell.cx + L.hex * 1.2, topY - L.hex * 0.2, '+' + CHRONO_BONUS / 1000 + ' s', '#67e8f9', L.hex * 0.55);
    }
    floatText(cell.cx, topY - L.hex * 0.6, '+' + pts, PALETTE[color].light, L.hex * (mult > 1 ? 0.95 : 0.75));
    if (mult > 1) floatText(cell.cx, topY - L.hex * 1.4, '×' + mult, '#ffe066', L.hex * 0.55);
    ring(cell.cx, cell.cy, PALETTE[color].top, 1.6);
    ring(cell.cx, cell.cy, '#ffffff', 2.6);
    if (!save.lowFx) rays.push({ x: cell.cx, y: topY, color, t0: now, dur: epic ? 900 : 650, big: epic });
    burst(cell.cx, cell.cy - L.hex * 0.4, color, epic ? 48 : 28, epic ? 1.6 : 1.3);
    state.shake = Math.min(16, 6 + k * 0.3 + state.combo);
    if (epic) flash('rgba(255, 255, 255, 1)', 260);
    Sfx.chord(state.combo);
    buzz(epic ? [30, 40, 70] : 25);
    await sleep(170);
  }

  /* =====================================================================
   * Résolution des fusions en chaîne
   * ===================================================================== */
  /** Piles reliées (de voisin en voisin) dont le sommet est de la couleur donnée, à partir de `cell`. */
  function sameColorGroup(cell, color) {
    const group = [cell];
    for (let i = 0; i < group.length; i++) {
      for (const n of group[i].nb) {
        if (n.stack.length && topColor(n.stack) === color && !group.includes(n)) group.push(n);
      }
    }
    return group;
  }

  /**
   * Pile qui recevra tout le groupe : celle qui touche le plus de piles du groupe.
   * À égalité, une pile monochrome (la vider ne révélerait rien, autant la remplir),
   * puis la pile en cours de traitement — même choix qu'avant pour deux piles seules.
   */
  function pickHub(group, cell) {
    let best = cell;
    let bestScore = -Infinity;
    for (const c of group) {
      const links = c.nb.filter(n => group.includes(n)).length;
      const score = links * 100 + (isPure(c.stack) ? 10 : 0) + (c === cell ? 5 : 0);
      if (score > bestScore) { bestScore = score; best = c; }
    }
    return best;
  }

  async function resolveFrom(startCells, gen) {
    let chain = 0;
    const queue = [];
    const queued = new Set();
    const push = c => { if (c && !queued.has(c)) { queued.add(c); queue.push(c); } };
    startCells.forEach(push);

    // Filet de sécurité : quand la file est vide, on balaie tout le plateau. Toute paire de voisins
    // de même couleur ou toute pile de 10+ restée sur place relance la résolution, jusqu'à stabilité.
    // (La limite ne sert qu'à éviter une boucle infinie en cas d'erreur de logique.)
    const unsettled = () => state.cells.filter(c => c.stack.length && (
      topRun(c.stack) >= COLLECT_THRESHOLD ||
      c.nb.some(n => n.stack.length && topColor(n.stack) === topColor(c.stack))));
    let guard = 0;
    while (guard < 20000) {
      if (!queue.length) {
        const missed = unsettled();
        if (!missed.length) break;
        missed.forEach(push);
      }
      guard++;
      const cell = queue.shift();
      queued.delete(cell);
      if (!cell.stack.length) continue;

      const color = topColor(cell.stack);
      // Tout le groupe de piles reliées dont le sommet a cette couleur (pas seulement les voisins
      // directs) : une pile « pont » entre deux autres ne doit pas être vidée du mauvais côté.
      const group = sameColorGroup(cell, color);
      let target = cell;

      if (group.length > 1) {
        target = pickHub(group, cell);
        // Arbre de parcours depuis la pile centrale : les jetons convergent de proche en proche,
        // en commençant par les piles les plus éloignées.
        const parent = new Map([[target, null]]);
        const order = [target];
        for (let i = 0; i < order.length; i++) {
          for (const n of order[i].nb) {
            if (!parent.has(n) && group.includes(n)) { parent.set(n, order[i]); order.push(n); }
          }
        }
        for (let i = order.length - 1; i > 0; i--) {
          const src = order[i];
          const dst = parent.get(src);
          if (!src.stack.length || topColor(src.stack) !== color) continue;
          // Temps fort : les deux piles pulsent avant le saut, pour suivre la cascade
          dst.pulseAt = now;
          src.pulseAt = now;
          await sleep(110);
          if (gen !== state.gen) return chain;
          await transfer(src, dst, chain);
          if (gen !== state.gen) return chain;
          chain++;
          comboStep(dst);
          push(src);
          src.nb.forEach(push);
        }
        push(target);
      }

      if (target.stack.length && topRun(target.stack) >= COLLECT_THRESHOLD) {
        await collect(target, gen);
        if (gen !== state.gen) return chain;
        push(target);
        target.nb.forEach(push);
      }
    }
    return chain;
  }

  function placeStack(cell, stack) {
    cell.stack = stack.slice();
    cell.placedAt = now;
    cell.squashAt = now;
    Sfx.place();
    ring(cell.cx, cell.cy, null, 1);
    state.combo = 0;
    state.noteIdx = 0;
    state.comboShowUntil = 0;
    state.feverOn = state.fever > 0;
    if (state.feverOn) state.fever--;
    document.body.classList.toggle('fever', state.feverOn);
    if (isSpecial()) {
      state.turn++;
      if (rules().moves) state.movesLeft--;
    }
    const gen = state.gen;
    state.busy = true;
    resolveFrom([cell], gen).then(async () => {
      if (gen !== state.gen) return;
      // Attendre que tous les jetons collectés aient rejoint la jauge avant de juger le niveau
      while (orbs.length) {
        await sleep(40);
        if (gen !== state.gen) return;
      }
      finishCombo();
      afterTurn();
    });
  }

  function afterTurn() {
    if (state.dock.every(d => !d)) refillDock();
    state.busy = false;
    updateTools();
    if (!isSpecial()) {
      if (state.score >= state.goal) { levelComplete(); return; }
      if (!state.cells.some(isFreeCell)) { gameOver(); return; }
      saveGame();
      return;
    }
    // Modes spéciaux
    if (rules().moves && state.movesLeft <= 0) { endSpecial('moves'); return; }
    if (state.mode === 'chrono' && state.timeLeft <= 0) { endSpecial('time'); return; }
    if (state.mode === 'survival' && state.turn > 0 && state.turn !== state.lastShrinkTurn) {
      state.lastShrinkTurn = state.turn;
      const t = state.turn;
      if (t >= state.nextRockTurn) {
        const n = rocksPerDrop(t);
        for (let i = 0; i < n; i++) addRock(i, rockHpAt(t));
        banner(n > 1 ? `Pluie de rochers ×${n} !` : 'Le plateau rétrécit !', '#c4c7dc', 0.8);
        state.nextRockTurn = t + rockInterval(t);
      }
      // Annonces des paliers de difficulté
      if (rockInterval(t) < rockInterval(t - 1)) banner('Les rochers accélèrent !', '#ff9a3c', 0.75);
      if (rockHpAt(t) > rockHpAt(t - 1)) banner('Rochers renforcés !', '#a3a7bf', 0.8);
      if (survivalColors(t) > survivalColors(t - 1)) banner('Nouvelle couleur !', '#67e8f9', 0.8);
    }
    if (!state.cells.some(isFreeCell)) { specialFull(); return; }
    saveGame();
  }

  /**
   * Plateau plein alors qu'aucune fenêtre n'est ouverte (le joueur a refusé le marteau proposé
   * en touchant ailleurs) : on relance la fin de partie au lieu de laisser le jeu bloqué.
   */
  function checkStuck() {
    if (state.busy || state.modalOpen || state.homeOpen || state.hammerMode) return;
    if (state.cells.some(isFreeCell)) return;
    if (isSpecial()) specialFull(); else gameOver();
  }

  /* ---------------- Survie : rochers ---------------- */
  const ringOf = c => Math.max(Math.abs(c.q), Math.abs(c.r), Math.abs(c.q + c.r));

  /** Un rocher tombe sur une case libre du bord : le terrain se réduit de l'extérieur vers le centre. */
  /** Un rocher tombe sur une case libre du bord (les suivants d'une pluie arrivent en décalé). */
  function addRock(index = 0, hp = 1) {
    const free = state.cells.filter(isFreeCell);
    if (!free.length) return;
    const outer = Math.max(...free.map(ringOf));
    const cand = free.filter(c => ringOf(c) === outer);
    const cell = cand[Math.floor(Math.random() * cand.length)];
    cell.rock = true;
    cell.rockHp = hp;
    cell.rockAt = now + index * 180;
    after(300 + index * 180, () => {
      Sfx.impact();
      state.shake = 9;
      burst(cell.cx, cell.cy, null, 16, 0.9);
      ring(cell.cx, cell.cy, '#c4c7dc', 1.5);
    });
  }

  /**
   * Une collecte voisine abîme le rocher : un rocher renforcé se fissure d'abord, puis se brise.
   * Le marteau (force) le brise toujours d'un coup.
   */
  function breakRock(cell, bonus, force = false) {
    if (!force && cell.rockHp > 1) {
      cell.rockHp--;
      cell.crackAt = now;
      burst(cell.cx, cell.cy - L.plateH * 2, null, 10, 0.7);
      Sfx.tone(180, 0.15, 'square', 0.12, 0, 90);
      floatText(cell.cx, cell.cy - L.hex * 0.6, 'Fissuré !', '#c4c7dc', L.hex * 0.42);
      return;
    }
    cell.rock = false;
    cell.rockHp = 0;
    burst(cell.cx, cell.cy - L.plateH * 2, null, 24, 1.2);
    ring(cell.cx, cell.cy, '#e5e7f5', 1.6);
    Sfx.smash();
    if (bonus) {
      state.score += ROCK_BONUS;
      floatText(cell.cx, cell.cy - L.hex * 0.6, 'Rocher brisé +' + ROCK_BONUS, '#e5e7f5', L.hex * 0.45);
    }
  }

  /* ---------------- Fin d'une partie en mode spécial ---------------- */
  function specialFull() {
    if (state.hammers <= 0) { endSpecial('full'); return; }
    state.over = true;
    Sfx.lose();
    saveGame();
    showModal({
      icon: '🧱',
      title: 'Plateau plein !',
      text: `Score : <b>${state.score}</b><br>Un coup de marteau pour continuer ?`,
      buttons: [
        { label: `Utiliser le marteau (${state.hammers})`, primary: true, onClick: () => { hideModal(); state.over = false; setHammerMode(true); } },
        { label: 'Terminer la partie', onClick: () => { hideModal(); endSpecial('full'); } },
      ],
    });
  }

  function endSpecial(reason) {
    state.over = true;
    state.busy = true;
    setHammerMode(false);
    if (state.mode === 'daily') ensureDaily();
    const m = MODES[state.mode];
    const rec = save.special[state.mode];
    const isRecord = state.score > 0 && state.score > rec.best;
    rec.best = Math.max(rec.best, state.score);
    rec.bestCombo = Math.max(rec.bestCombo, state.levelBestCombo);
    rec.plays++;
    rec.game = null;
    persist();
    const why = { moves: 'Toutes les piles ont été posées.', time: 'Temps écoulé !', full: 'Plus aucune case libre.' }[reason];
    const extra = state.mode === 'survival' ? `<br>Tu as tenu <b>${state.turn}</b> piles` : '';
    if (isRecord) { Sfx.win(); confetti(); } else Sfx.lose();
    after(450, () => showModal({
      icon: isRecord ? '🏆' : m.icon,
      title: isRecord ? 'Nouveau record !' : 'Partie terminée',
      text: `${why}<br>Score : <b>${state.score}</b>${extra}<br>` +
        `${state.mode === 'daily' ? 'Record du jour' : 'Record'} : <b>${rec.best}</b>` +
        (rec.bestCombo >= 2 ? ` · meilleur combo ×${rec.bestCombo}` : ''),
      buttons: [
        { label: state.mode === 'daily' ? 'Rejouer le défi' : 'Rejouer', primary: true, onClick: () => startLevel(1) },
        { label: 'Menu', onClick: () => { hideModal(); showHome(); } },
      ],
    }));
  }

  /* =====================================================================
   * Outils : marteau & relance
   * ===================================================================== */
  function setHammerMode(on) {
    state.hammerMode = !!on && state.hammers > 0;
    $('hint').classList.toggle('show', state.hammerMode);
    $('btnHammer').classList.toggle('active', state.hammerMode);
    if (!state.hammerMode) hoverCell = null;
    canvas.style.cursor = state.hammerMode ? 'crosshair' : 'default';
  }

  async function useHammer(cell) {
    const gen = state.gen;
    state.hammers--;
    setHammerMode(false);
    updateTools();
    state.busy = true;
    hammerFx = { cell, t0: now, topY: cell.cy - cell.stack.length * L.th };
    await sleep(170);
    if (gen !== state.gen) return;
    Sfx.smash();
    state.shake = 14;
    ring(cell.cx, cell.cy, null, 2);
    if (cell.rock) breakRock(cell, false, true); // le marteau brise aussi les rochers, même renforcés
    while (cell.stack.length) {
      const y = cell.cy - cell.stack.length * L.th;
      const color = cell.stack.pop();
      burst(cell.cx, y, color, 7, 1.2);
      await sleep(28);
      if (gen !== state.gen) return;
    }
    state.busy = false;
    state.over = false;
    updateTools();
    saveGame();
  }

  function reroll() {
    if (state.busy || state.rerolls <= 0 || state.modalOpen || drag) return;
    state.rerolls--;
    setHammerMode(false);
    refillDock();
    updateTools();
    saveGame();
  }

  function updateTools() {
    $('hammerCount').textContent = state.hammers;
    $('rerollCount').textContent = state.rerolls;
    $('btnHammer').disabled = state.hammers <= 0;
    $('btnReroll').disabled = state.rerolls <= 0;
    // Partie sans outils (préférence) : on masque les boutons plutôt que de les laisser grisés
    const hideTools = state.hammers <= 0 && state.rerolls <= 0 && save.noTools;
    if (document.body.classList.contains('noTools') !== hideTools) {
      document.body.classList.toggle('noTools', hideTools);
      layout(); // la place libérée (ou reprise) par la barre d'outils change la taille du plateau
    }
  }

  /* =====================================================================
   * Modales
   * ===================================================================== */
  function showModal({ icon, title, text, buttons }) {
    $('mIcon').textContent = icon;
    $('mTitle').textContent = title;
    $('mText').innerHTML = text; // contenu généré localement uniquement
    const box = $('mBtns');
    box.innerHTML = '';
    for (const b of buttons) {
      const btn = document.createElement('button');
      btn.className = 'mBtn' + (b.primary ? ' primary' : '');
      btn.textContent = b.label;
      btn.addEventListener('click', () => { Sfx.init(); Sfx.click(); b.onClick(); });
      box.appendChild(btn);
    }
    $('modal').classList.add('show');
    state.modalOpen = true;
  }

  function hideModal() {
    $('modal').classList.remove('show');
    state.modalOpen = false;
  }

  function levelComplete() {
    state.busy = true;
    recordWin();
    Sfx.win();
    confetti();
    const stars = starsFor(state.level);
    after(500, () => showModal({
      icon: '🏆',
      title: 'Niveau terminé !',
      text: `<span style="font-size:26px;color:#ffd84d;letter-spacing:4px">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</span><br>` +
        `Score : <b>${state.score}</b> / ${state.goal}` +
        (state.levelBestCombo >= 2 ? ` · meilleur combo ×${state.levelBestCombo}` : '') + '<br>' +
        `Prochain objectif : <b>${goalFor(state.level + 1)}</b>`,
      buttons: [
        { label: 'Niveau suivant ▶', primary: true, onClick: () => startLevel(state.level + 1) },
        { label: 'Menu des niveaux', onClick: () => { hideModal(); showHome(); } },
      ],
    }));
  }

  function gameOver() {
    state.over = true;
    Sfx.lose();
    // Sans marteau, la partie est perdue : on n'en garde pas la sauvegarde
    if (state.hammers > 0) saveGame(); else clearGame();
    const buttons = [{ label: 'Réessayer', primary: true, onClick: () => startLevel(state.level) }];
    if (state.hammers > 0) {
      buttons.push({
        label: `Utiliser le marteau (${state.hammers})`,
        onClick: () => { hideModal(); state.over = false; setHammerMode(true); },
      });
    }
    buttons.push({ label: 'Menu des niveaux', onClick: () => { hideModal(); showHome(); } });
    showModal({
      icon: '🧱',
      title: 'Plateau plein !',
      text: `Plus aucune case libre.<br>Score : <b>${state.score}</b> / ${state.goal}`,
      buttons,
    });
  }

  /* =====================================================================
   * Entrées unifiées (pointer events)
   * ===================================================================== */
  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function pickDock(p) {
    for (let i = 0; i < 3; i++) {
      const d = state.dock[i];
      if (!d || now < d.born + 120) continue;
      const h = d.stack.length * L.th * L.dockScale;
      if (Math.abs(p.x - L.dockX[i]) < L.hex * 1.3 &&
          p.y > L.dockY - h - L.hex * 0.95 && p.y < L.dockY + L.hex * 0.95) return i;
    }
    return -1;
  }

  function findDropCell(bx, by) {
    let best = null, bestD = Infinity;
    for (const c of state.cells) {
      const dx = bx - c.cx, dy = (by - c.cy) / ISO_SCALE_Y;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = c; }
    }
    if (best && isFreeCell(best) && best.incoming === 0 && bestD < Math.pow(L.hex * 0.95, 2)) return best;
    return null;
  }

  function pickStackCell(p) {
    for (let i = state.drawOrder.length - 1; i >= 0; i--) {
      const c = state.drawOrder[i];
      if (!c.stack.length && !c.rock) continue; // le marteau vise une pile ou un rocher
      const top = c.cy - (c.rock ? L.plateH * 2.4 : c.stack.length * L.th);
      if (Math.abs(p.x - c.cx) < L.tile * 0.95 &&
          p.y > top - L.tile * 0.8 * ISO_SCALE_Y && p.y < c.cy + L.tile * 0.9 * ISO_SCALE_Y) return c;
    }
    return null;
  }

  canvas.addEventListener('pointerdown', e => {
    Sfx.init();
    if (state.modalOpen || state.homeOpen) return;
    const p = pointerPos(e);

    if (state.hammerMode) {
      const cell = pickStackCell(p);
      if (cell && !state.busy) useHammer(cell);
      else { setHammerMode(false); checkStuck(); }
      return;
    }
    if (state.busy || drag || state.over) return;
    if (state.mode === 'chrono' && state.timeLeft <= 0) return;

    const slot = pickDock(p);
    if (slot < 0) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    const offY = e.pointerType === 'mouse' ? L.hex * 0.5 : L.hex * 1.6;
    drag = {
      slot, stack: state.dock[slot].stack, pid: e.pointerId,
      x: p.x, y: p.y, offY, target: null, scale: L.dockScale, ret: null,
    };
    drag.target = findDropCell(p.x, p.y - offY);
    canvas.style.cursor = 'grabbing';
    Sfx.pick();
  });

  canvas.addEventListener('pointermove', e => {
    const p = pointerPos(e);
    if (drag && !drag.ret && e.pointerId === drag.pid) {
      drag.x = p.x; drag.y = p.y;
      const prev = drag.target;
      drag.target = findDropCell(p.x, p.y - drag.offY);
      if (drag.target && drag.target !== prev) Sfx.tone(700, 0.04, 'sine', 0.04);
      return;
    }
    if (state.hammerMode) { hoverCell = pickStackCell(p); return; }
    if (e.pointerType === 'mouse' && !drag) {
      canvas.style.cursor = (!state.busy && !state.modalOpen && pickDock(p) >= 0) ? 'grab' : 'default';
    }
  });

  function endDrag(e) {
    if (!drag || drag.ret || e.pointerId !== drag.pid) return;
    const p = pointerPos(e);
    drag.x = p.x; drag.y = p.y;
    const cell = findDropCell(p.x, p.y - drag.offY);
    canvas.style.cursor = 'default';
    if (cell && e.type === 'pointerup' && !state.busy) {
      const st = drag.stack;
      state.dock[drag.slot] = null;
      drag = null;
      placeStack(cell, st);
    } else {
      drag.target = null;
      drag.ret = { t0: now, fx: drag.x, fy: drag.y };
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  function toggleSound() {
    Sfx.init();
    Sfx.muted = !Sfx.muted;
    save.muted = Sfx.muted;
    persist();
    renderSoundIcon();
    Sfx.click();
  }
  $('btnSound').addEventListener('click', toggleSound);
  $('homeSound').addEventListener('click', toggleSound);

  /* ---------------- Page d'accueil & sélection des niveaux ---------------- */
  function renderDiffBar() {
    const bar = $('diffBar');
    bar.innerHTML = '';
    for (const k of DIFF_ORDER) {
      const b = document.createElement('button');
      b.className = 'diffBtn' + (k === state.diff ? ' active' : '');
      b.dataset.diff = k;
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(k === state.diff));
      b.innerHTML = `${DIFFICULTIES[k].name}<span class="lv">niv. ${save.progress[k].unlocked}</span>`;
      bar.appendChild(b);
    }
    $('diffDesc').textContent = diff().desc;
  }

  /** Change de difficulté : autre plateau, autre progression, autre partie sauvegardée. */
  function setDifficulty(k) {
    state.mode = 'levels';
    state.diff = k;
    save.current = k;
    persist();
    gridRadius = diff().radius;
    buildBoard();
    layout();
    const g = prog().game;
    if (g) restoreGame(g); else startLevel(prog().unlocked, false);
    $('diffName').textContent = diff().name;
  }

  $('diffBar').addEventListener('click', e => {
    const b = e.target.closest('.diffBtn');
    if (!b || b.dataset.diff === state.diff) return;
    Sfx.init(); Sfx.click();
    setDifficulty(b.dataset.diff);
    renderHome();
    scrollToCurrentLevel();
  });

  function renderHome() {
    renderDiffBar();
    const g = prog().game;
    const play = $('btnPlay');
    play.textContent = g ? `Continuer · Niveau ${g.level}` : `Jouer · Niveau ${prog().unlocked}`;
    const won = Object.keys(prog().best).length;
    const stars = Object.keys(prog().best).reduce((n, k) => n + starsFor(Number(k)), 0);
    $('homeInfo').textContent = won
      ? `${won} niveau${won > 1 ? 'x' : ''} réussi${won > 1 ? 's' : ''} · ${stars} ★ · ★★ = combo ×5, ★★★ = combo ×7`
      : 'Termine un niveau pour gagner des étoiles : ★★ = combo ×5, ★★★ = combo ×7';

    const grid = $('levelGrid');
    grid.innerHTML = '';
    // Au moins LEVEL_COUNT niveaux affichés, et toujours 20 de plus que le niveau débloqué
    const count = Math.ceil(Math.max(LEVEL_COUNT, prog().unlocked + 20) / WORLD_SIZE) * WORLD_SIZE;
    const frag = document.createDocumentFragment();
    for (let n = 1; n <= count; n++) {
      if ((n - 1) % WORLD_SIZE === 0) {
        const w = document.createElement('div');
        w.className = 'worldTitle';
        w.textContent = `Monde ${(n - 1) / WORLD_SIZE + 1} · niveaux ${n}–${n + WORLD_SIZE - 1}`;
        frag.appendChild(w);
      }
      const unlocked = n <= prog().unlocked;
      const b = document.createElement('button');
      const isCurrent = g ? g.level === n : n === prog().unlocked;
      b.className = 'lvlTile' + (unlocked ? '' : ' locked') + (isCurrent ? ' current' : '');
      b.disabled = !unlocked;
      b.dataset.level = n;
      b.setAttribute('aria-label', unlocked ? `Niveau ${n}` : `Niveau ${n} verrouillé`);
      const s = starsFor(n);
      b.innerHTML = unlocked
        ? `<b>${n}</b><span class="stars">${'★'.repeat(s)}${'☆'.repeat(3 - s)}</span>`
        : `<b>🔒</b><span class="stars">${n}</span>`;
      frag.appendChild(b);
    }
    grid.appendChild(frag);
    renderModes();
    $('homeSound').textContent = Sfx.muted ? '🔇 Son coupé' : '🔊 Son activé';
    $('homeTools').textContent = save.noTools ? '🚫 Sans outils' : '🔨 Avec outils';
    $('homeTools').title = 'Jouer sans marteau ni relance (s’applique à la prochaine partie)';
    $('homeFx').textContent = save.lowFx ? '⚡ Effets réduits' : '✨ Effets complets';
    $('homeFx').title = 'Moins de particules et une résolution plus basse, pour les téléphones modestes';
    $('btnResetProgress').textContent = homeTab === 'modes' ? 'Effacer les records' : 'Effacer la progression';
  }

  /* ---------------- Modes spéciaux & onglets de l'accueil ---------------- */
  let homeTab = 'levels';

  function applyTab() {
    $('tabLevels').classList.toggle('active', homeTab === 'levels');
    $('tabModes').classList.toggle('active', homeTab === 'modes');
    $('panelLevels').classList.toggle('show', homeTab === 'levels');
    $('panelModes').classList.toggle('show', homeTab === 'modes');
    $('btnResetProgress').textContent = homeTab === 'modes' ? 'Effacer les records' : 'Effacer la progression';
  }
  $('tabLevels').addEventListener('click', () => { Sfx.init(); Sfx.click(); homeTab = 'levels'; applyTab(); scrollToCurrentLevel(); });
  $('tabModes').addEventListener('click', () => { Sfx.init(); Sfx.click(); homeTab = 'modes'; applyTab(); });

  function renderModes() {
    ensureDaily();
    const list = $('modeList');
    list.innerHTML = '';
    for (const k of MODE_ORDER) {
      const m = MODES[k];
      const r = save.special[k];
      const live = r.game || (state.mode === k && !state.over);
      const rec = r.best ? `${k === 'daily' ? 'Aujourd’hui' : 'Record'} ${r.best}` : 'À découvrir';
      const b = document.createElement('button');
      b.className = 'modeCard';
      b.dataset.mode = k;
      b.innerHTML = `<span class="mi">${m.icon}</span>` +
        `<span class="mn"><span>${m.name}${live ? '<span class="live">en cours</span>' : ''}</span><span class="mr">${rec}</span></span>` +
        `<span class="md">${m.desc}</span>`;
      list.appendChild(b);
    }
  }

  /** Change de mode de jeu (reconstruit le plateau à la bonne taille). */
  function setMode(k) {
    state.mode = k;
    gridRadius = rules().radius;
    buildBoard();
    layout();
  }

  function startMode(k) {
    // Partie déjà ouverte dans ce mode (notamment le Chrono, jamais sauvegardé) : on la reprend telle quelle
    if (state.mode === k && !state.over) { hideHome(); return; }
    if (k === 'daily') ensureDaily();
    setMode(k);
    const g = save.special[k].game;
    if (g) restoreGame(g); else startLevel(1);
    hideHome();
  }

  $('modeList').addEventListener('click', e => {
    const b = e.target.closest('.modeCard');
    if (!b) return;
    Sfx.init(); Sfx.click();
    startMode(b.dataset.mode);
  });

  $('homeFx').addEventListener('click', () => {
    Sfx.init(); Sfx.click();
    save.lowFx = !save.lowFx;
    persist();
    layout(); // la résolution de rendu change tout de suite
    renderHome();
  });

  $('homeTools').addEventListener('click', () => {
    Sfx.init(); Sfx.click();
    save.noTools = !save.noTools;
    persist();
    renderHome();
  });

  // Un seul écouteur pour toute la grille (des centaines de cases)
  $('levelGrid').addEventListener('click', e => {
    const b = e.target.closest('.lvlTile');
    if (!b || b.disabled) return;
    const n = Number(b.dataset.level);
    if (isSpecial()) setMode('levels');
    const g = prog().game;
    Sfx.init(); Sfx.click();
    // Le niveau en cours reprend là où il en était ; un autre niveau démarre à neuf
    if (g && g.level === n) restoreGame(g); else startLevel(n);
    hideHome();
  });

  /** Fait défiler l'accueil jusqu'au niveau en cours (ou au dernier débloqué). */
  function scrollToCurrentLevel() {
    const n = prog().game ? prog().game.level : prog().unlocked;
    const tile = $('levelGrid').querySelector(`[data-level="${n}"]`);
    const wrap = $('gridWrap');
    if (!tile) { wrap.scrollTop = 0; return; }
    wrap.scrollTop = Math.max(0, tile.offsetTop - wrap.clientHeight / 2 + tile.offsetHeight / 2);
  }

  function showHome() {
    setHammerMode(false);
    if (isSpecial()) homeTab = 'modes';
    renderHome();
    applyTab();
    $('home').classList.add('show');
    state.homeOpen = true;
    scrollToCurrentLevel();
  }

  function hideHome() {
    $('home').classList.remove('show');
    state.homeOpen = false;
    after(350, checkStuck); // une partie reprise sur un plateau plein doit afficher sa fin
  }

  $('btnPlay').addEventListener('click', () => {
    Sfx.init(); Sfx.click();
    if (isSpecial()) setMode('levels');
    if (prog().game) restoreGame(prog().game); else startLevel(prog().unlocked);
    hideHome();
  });
  $('btnResetProgress').addEventListener('click', () => {
    if (homeTab === 'modes') {
      if (!window.confirm('Effacer les records et les parties en cours de tous les modes spéciaux ?')) return;
      for (const k of MODE_ORDER) save.special[k] = cleanSpecial(null);
      persist();
      if (isSpecial()) { setMode('levels'); startLevel(prog().unlocked, false); }
      renderHome();
      return;
    }
    if (!window.confirm(`Effacer la progression du mode ${diff().name} (niveaux, étoiles et partie en cours) ?`)) return;
    if (isSpecial()) setMode('levels');
    prog().unlocked = 1;
    prog().best = {};
    prog().game = null;
    persist();
    startLevel(1, false);
    renderHome();
  });
  $('btnHome').addEventListener('click', () => {
    Sfx.init();
    if (state.busy || state.modalOpen) return; // on attend la fin de la cascade
    Sfx.click();
    showHome();
  });
  $('btnRestart').addEventListener('click', () => { Sfx.init(); Sfx.click(); startLevel(state.level); });
  $('btnHammer').addEventListener('click', () => {
    Sfx.init();
    if (state.busy || state.modalOpen || state.homeOpen || state.hammers <= 0) return;
    Sfx.click();
    setHammerMode(!state.hammerMode);
    if (!state.hammerMode) checkStuck();
  });
  $('btnReroll').addEventListener('click', () => { Sfx.init(); reroll(); });

  function renderSoundIcon() {
    $('btnSound').innerHTML = Sfx.muted
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" fill-opacity=".25"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" fill-opacity=".25"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  }

  /* =====================================================================
   * Rendu
   * ===================================================================== */
  function highlightCell(c, cell, fill, stroke) {
    hexPath(c, L.plateR * 0.96, cell.cx, cell.cy);
    c.fillStyle = fill;
    c.fill();
    c.lineWidth = Math.max(2, L.hex * 0.07);
    c.strokeStyle = stroke;
    c.stroke();
  }

  /** Une case est-elle masquée par une pile (ou un rocher) dessinée devant elle ? */
  function isOccluded(f) {
    for (const o of state.cells) {
      if (o === f || o.cy <= f.cy || (!o.stack.length && !o.rock)) continue;
      if (Math.abs(o.cx - f.cx) > L.tile * 1.4) continue;
      const h = o.rock ? L.plateH * 2.4 : o.stack.length * L.th;
      const topEdge = o.cy - h - L.tile * HEX_SIN * ISO_SCALE_Y; // haut de la face supérieure de la pile
      if (topEdge < f.cy) return true;
    }
    return false;
  }

  /** Rocher de la Survie : tombe du ciel à son apparition, fissuré, plus haut qu'un socle. */
  function drawRock(c, cell) {
    const t = clamp((now - cell.rockAt) / 420, 0, 1);
    const drop = (1 - easeOutBack(t)) * L.hex * 2.4;
    const hard = cell.rockHp > 1;
    const h = L.plateH * (hard ? 3 : 2.4);
    // petit tremblement juste après une fissure
    const tc = (now - cell.crackAt) / 300;
    const jitter = tc >= 0 && tc < 1 ? Math.sin(tc * 40) * L.hex * 0.05 * (1 - tc) : 0;
    const base = cell.cy - drop;
    const cx = cell.cx + jitter;
    c.save();
    c.globalAlpha = Math.min(1, t * 3 + 0.05);
    drawToken(c, cx, base, L.tile * 0.98, h, hard ? ROCK_HARD : ROCK);
    const top = base - h;
    const r = L.tile;
    if (hard) {
      // Granit renforcé : pas de fissure, deux bandes de métal sur le dessus
      c.strokeStyle = 'rgba(200, 205, 230, 0.55)';
      c.lineWidth = Math.max(1.5, L.hex * 0.06);
      c.beginPath();
      c.moveTo(cx - r * 0.6, top - r * 0.18); c.lineTo(cx + r * 0.6, top - r * 0.18);
      c.moveTo(cx - r * 0.6, top + r * 0.18); c.lineTo(cx + r * 0.6, top + r * 0.18);
      c.stroke();
      c.restore();
      return;
    }
    c.translate(jitter, 0);
    c.strokeStyle = 'rgba(25, 25, 40, 0.6)';
    c.lineWidth = Math.max(1, L.hex * 0.045);
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(cell.cx - r * 0.5, top - r * 0.12);
    c.lineTo(cell.cx - r * 0.12, top + r * 0.05);
    c.lineTo(cell.cx + r * 0.18, top - r * 0.2);
    c.moveTo(cell.cx - r * 0.12, top + r * 0.05);
    c.lineTo(cell.cx + r * 0.05, top + r * 0.32);
    c.stroke();
    c.restore();
  }

  function drawBoard(c) {
    // Halo sous le plateau
    c.fillStyle = glowGrad;
    const gr = L.hex * (2 * gridRadius + 1);
    c.fillRect(L.boardCX - gr, L.boardCY - gr, gr * 2, gr * 2);

    // Socles des cases (triés par Y)
    for (const cell of state.drawOrder) {
      drawToken(c, cell.cx, cell.cy + L.plateH, L.plateR, L.plateH, PLATE);
      hexPath(c, L.plateR * 0.62, cell.cx, cell.cy);
      c.strokeStyle = 'rgba(255, 255, 255, 0.06)';
      c.lineWidth = 1;
      c.stroke();
    }

    const pulse = 0.5 + 0.5 * Math.sin(now / 110);
    if (drag && drag.target) {
      highlightCell(c, drag.target, `rgba(120, 255, 170, ${0.22 + 0.18 * pulse})`, `rgba(190, 255, 210, ${0.7 + 0.3 * pulse})`);
    }
    if (state.hammerMode && hoverCell) {
      highlightCell(c, hoverCell, `rgba(255, 70, 100, ${0.25 + 0.2 * pulse})`, 'rgba(255, 150, 170, 0.9)');
    }

    // Piles (Painter's algorithm : les piles du bas passent devant)
    for (const cell of state.drawOrder) {
      if (cell.rock) { drawRock(c, cell); continue; }
      if (!cell.stack.length) continue;
      const tp = (now - cell.placedAt) / 260;
      const bounce = tp >= 0 && tp < 1 ? -Math.sin(tp * Math.PI) * L.hex * 0.18 * (1 - tp) : 0;
      // Écrasement élastique à chaque atterrissage + gonflement pendant le temps fort
      let sx = 1, sy = 1;
      const ts = (now - cell.squashAt) / 240;
      if (ts >= 0 && ts < 1) {
        const s = Math.sin(ts * Math.PI) * (1 - ts);
        sx = 1 + 0.10 * s;
        sy = 1 - 0.16 * s;
      }
      const tpu = (now - cell.pulseAt) / 260;
      if (tpu >= 0 && tpu < 1) {
        const s = Math.sin(tpu * Math.PI);
        sx *= 1 + 0.06 * s;
        sy *= 1 + 0.06 * s;
      }
      if (sx !== 1 || sy !== 1) {
        c.save();
        c.translate(cell.cx, cell.cy + bounce);
        c.scale(sx, sy);
        drawStack(c, 0, 0, cell.stack, true);
        c.restore();
      } else {
        drawStack(c, cell.cx, cell.cy + bounce, cell.stack, true);
      }
      if (tpu >= 0 && tpu < 1) {
        const top = cell.cy - cell.stack.length * L.th;
        c.save();
        c.globalCompositeOperation = 'lighter';
        hexPath(c, L.tile * (1 + 0.35 * tpu), cell.cx, top);
        c.strokeStyle = `rgba(255, 255, 255, ${0.85 * (1 - tpu)})`;
        c.lineWidth = Math.max(2, L.hex * 0.09);
        c.stroke();
        c.restore();
      }
      if (state.hammerMode && hoverCell === cell) {
        const top = cell.cy - cell.stack.length * L.th;
        hexPath(c, L.tile, cell.cx, top);
        c.fillStyle = `rgba(255, 60, 90, ${0.2 + 0.2 * pulse})`;
        c.fill();
      }
    }

    // Cases libres cachées derrière une haute pile du rang de devant. On ne les signale que
    // lorsque TOUTES les cases libres sont cachées (sinon le joueur a de quoi jouer et le
    // marqueur ne ferait que gêner), ou quand le joueur glisse une pile dessus.
    // Contour seul, sans fond : les chiffres des piles de devant restent lisibles.
    const free = state.cells.filter(isFreeCell);
    const hidden = free.filter(isOccluded);
    const allHidden = hidden.length > 0 && hidden.length === free.length;
    for (const f of hidden) {
      const isTarget = drag && drag.target === f;
      if (!allHidden && !isTarget) continue;
      c.save();
      hexPath(c, L.plateR * 0.9, f.cx, f.cy);
      if (isTarget) {
        c.fillStyle = 'rgba(120, 255, 170, 0.18)';
        c.fill();
      }
      c.globalAlpha = isTarget ? 1 : 0.6 + 0.4 * pulse;
      c.shadowColor = isTarget ? '#7dffb0' : '#ffd84d';
      c.shadowBlur = 8;
      c.setLineDash([7, 5]);
      c.lineDashOffset = -now / 40;
      c.lineWidth = Math.max(2, L.hex * 0.07);
      c.strokeStyle = isTarget ? '#bfffd6' : '#ffe066';
      c.stroke();
      c.restore();
    }

    // Aperçu pendant le glisser : les voisins qui vont fusionner s'illuminent, reliés à la case visée
    if (drag && drag.target && !drag.ret) {
      const col = topColor(drag.stack);
      for (const n of drag.target.nb) {
        if (!n.stack.length || topColor(n.stack) !== col) continue;
        const top = n.cy - n.stack.length * L.th;
        c.save();
        c.globalCompositeOperation = 'lighter';
        hexPath(c, L.tile * (1.02 + 0.06 * pulse), n.cx, top);
        c.fillStyle = `rgba(255, 255, 255, ${0.12 + 0.12 * pulse})`;
        c.fill();
        c.lineWidth = Math.max(2, L.hex * 0.08);
        c.strokeStyle = PALETTE[col].light;
        c.stroke();
        c.restore();
        c.save();
        c.setLineDash([6, 6]);
        c.lineDashOffset = -now / 30;
        c.strokeStyle = PALETTE[col].light;
        c.globalAlpha = 0.85;
        c.lineWidth = 3;
        c.beginPath();
        c.moveTo(n.cx, top);
        c.lineTo(drag.target.cx, drag.target.cy);
        c.stroke();
        c.restore();
      }
    }

    // Jetons en vol (triés par Y), avec traînée lumineuse et retournement 3D
    const poses = flyers.filter(f => f.started).map(f => ({ f, p: flyerPose(f) })).sort((a, b) => a.p.y - b.p.y);
    for (const { f, p } of poses) {
      f.trail = f.trail || [];
      if (!save.lowFx) f.trail.push({ x: p.x, y: p.y - L.th / 2 }); // effets réduits : pas de traînée
      if (f.trail.length > 9) f.trail.shift();
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = PALETTE[f.color].light;
      for (let j = 0; j < f.trail.length - 1; j++) {
        const q = f.trail[j];
        const k = (j + 1) / f.trail.length;
        c.globalAlpha = 0.28 * k;
        c.beginPath();
        c.ellipse(q.x, q.y, L.tile * 0.55 * k, L.tile * 0.55 * k * ISO_SCALE_Y, 0, 0, Math.PI * 2);
        c.fill();
      }
      c.restore();
      const flip = Math.cos(2 * Math.PI * p.e);
      c.save();
      c.translate(p.x, p.y - L.th / 2);
      c.rotate(p.ang);
      c.scale(Math.max(0.08, Math.abs(flip)), 1);
      c.rotate(-p.ang);
      drawToken(c, 0, L.th / 2, L.tile, L.th, PALETTE[f.color], flip < 0);
      c.restore();
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawDock(c) {
    const pw = Math.min(W - 20, (L.dockX[2] - L.dockX[0]) + L.hex * 3.2);
    const ph = L.hex * 2.7;
    roundRect(c, W / 2 - pw / 2, L.dockY - ph * 0.6, pw, ph, L.hex * 0.6);
    c.fillStyle = 'rgba(255, 255, 255, 0.06)';
    c.fill();
    c.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    c.lineWidth = 1;
    c.stroke();

    for (let i = 0; i < 3; i++) {
      const x = L.dockX[i];
      c.save();
      c.translate(x, L.dockY);
      c.scale(L.dockScale, L.dockScale);
      hexPath(c, L.tile * 1.05);
      c.fillStyle = 'rgba(0, 0, 0, 0.22)';
      c.fill();
      c.setLineDash([5, 5]);
      c.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      c.lineWidth = 1.5;
      c.stroke();
      c.setLineDash([]);
      c.restore();

      const d = state.dock[i];
      if (!d || (drag && drag.slot === i)) continue;
      const e = clamp((now - d.born) / 380, 0, 1);
      if (e <= 0) continue;
      const sc = L.dockScale * easeOutBack(e);
      c.save();
      c.translate(x, L.dockY);
      c.scale(sc, sc);
      drawStack(c, 0, 0, d.stack, true);
      c.restore();
    }
  }

  function drawDrag(c) {
    if (!drag) return;
    let x = drag.x, y = drag.y;
    if (drag.ret) {
      const t = easeOutCubic(clamp((now - drag.ret.t0) / RETURN_DURATION, 0, 1));
      x = lerp(drag.ret.fx, L.dockX[drag.slot], t);
      y = lerp(drag.ret.fy, L.dockY + drag.offY, t);
    }
    const bx = x, by = y - drag.offY;
    drag.scale = lerp(drag.scale, drag.ret ? L.dockScale : 1, 0.25);
    const lift = drag.ret ? 0 : L.hex * 0.5;

    // Ombre portée (sur la case ciblée si valide)
    const sx = drag.target ? drag.target.cx : bx;
    const sy = drag.target ? drag.target.cy : by;
    c.save();
    c.translate(sx, sy);
    c.scale(drag.scale, drag.scale);
    c.shadowColor = 'rgba(0, 0, 0, 0.6)';
    c.shadowBlur = L.hex * 0.4;
    hexPath(c, L.tile * 1.02);
    c.fillStyle = 'rgba(0, 0, 0, 0.35)';
    c.fill();
    c.restore();

    c.save();
    c.translate(bx, by - lift);
    c.scale(drag.scale, drag.scale);
    drawStack(c, 0, 0, drag.stack, true);
    c.restore();
  }

  function drawHammer(c) {
    if (!hammerFx) return;
    const t = (now - hammerFx.t0) / 520;
    if (t >= 1) { hammerFx = null; return; }
    const s = L.hex;
    const swing = t < 0.33 ? lerp(1.15, 0, easeInCubic(t / 0.33)) : (t < 0.45 ? -0.08 * Math.sin((t - 0.33) / 0.12 * Math.PI) : 0);
    const len = s * 1.7;
    const px = hammerFx.cell.cx + len, py = hammerFx.topY - s * 0.32;
    c.save();
    c.globalAlpha = t > 0.7 ? 1 - (t - 0.7) / 0.3 : 1;
    c.translate(px, py);
    c.rotate(swing);
    c.fillStyle = '#8b5a2b';
    roundRect(c, -len, -s * 0.08, len + s * 0.15, s * 0.16, s * 0.06);
    c.fill();
    const hg = c.createLinearGradient(-len, -s * 0.34, -len, s * 0.34);
    hg.addColorStop(0, '#e5e7eb');
    hg.addColorStop(0.5, '#9ca3af');
    hg.addColorStop(1, '#4b5563');
    c.fillStyle = hg;
    roundRect(c, -len - s * 0.3, -s * 0.34, s * 0.6, s * 0.66, s * 0.08);
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.4)';
    c.lineWidth = 1.5;
    c.stroke();
    c.restore();
  }

  function drawFx(c) {
    for (const r of rings) {
      const t = 1 - r.life / r.max;
      c.save();
      c.globalAlpha = (1 - t) * 0.8;
      hexPath(c, L.tile * (1 + t * 0.9 * r.size), r.x, r.y);
      c.strokeStyle = r.color;
      c.lineWidth = Math.max(1.5, L.hex * 0.08 * (1 - t));
      c.stroke();
      c.restore();
    }
    drawParticleList(c, particles);
    for (const f of floats) {
      const t = 1 - f.life / f.max;
      const sc = t < 0.18 ? easeOutBack(t / 0.18) : 1;
      c.save();
      c.globalAlpha = f.life < 0.35 ? f.life / 0.35 : 1;
      c.translate(f.x, f.y);
      c.scale(sc, sc);
      c.font = `900 ${Math.round(f.size)}px ${FONT}`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.lineJoin = 'round';
      c.lineWidth = f.size * 0.16;
      c.strokeStyle = 'rgba(20, 10, 40, 0.85)';
      c.strokeText(f.text, 0, 0);
      c.fillStyle = f.color;
      c.fillText(f.text, 0, 0);
      c.restore();
    }
  }

  function drawParticleList(c, list) {
    for (const p of list) {
      c.save();
      c.globalAlpha = clamp(p.life / p.max * 1.4, 0, 1);
      c.translate(p.x, p.y);
      c.rotate(p.rot);
      c.fillStyle = p.color;
      c.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      c.restore();
    }
  }

  /** Rayons lumineux qui tournent autour d'une collecte. */
  function drawRays(c) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (let i = rays.length - 1; i >= 0; i--) {
      const r = rays[i];
      const t = (now - r.t0) / r.dur;
      if (t >= 1) { rays.splice(i, 1); continue; }
      const len = L.hex * (r.big ? 6.5 : 4) * easeOutCubic(Math.min(1, t * 2));
      const n = r.big ? 16 : 12;
      c.globalAlpha = 0.5 * (1 - t);
      c.fillStyle = PALETTE[r.color].light;
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2 + t * 1.2;
        const w = 0.09;
        c.beginPath();
        c.moveTo(r.x, r.y);
        c.lineTo(r.x + Math.cos(a - w) * len, r.y + Math.sin(a - w) * len * ISO_SCALE_Y);
        c.lineTo(r.x + Math.cos(a + w) * len, r.y + Math.sin(a + w) * len * ISO_SCALE_Y);
        c.closePath();
        c.fill();
      }
    }
    c.restore();
  }

  function render() {
    const c = ctx;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = bgGrad;
    c.fillRect(0, 0, W, H);
    if (state.feverOn) {
      const hue = (now / 10) % 360;
      const g = c.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, Math.max(W, H) * 0.75);
      g.addColorStop(0, `hsla(${hue}, 90%, 55%, 0.22)`);
      g.addColorStop(1, `hsla(${(hue + 120) % 360}, 90%, 40%, 0.06)`);
      c.fillStyle = g;
      c.fillRect(0, 0, W, H);
    }

    c.save();
    if (state.shake > 0.1) c.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    drawBoard(c);
    drawRays(c);
    drawHammer(c);
    c.restore();

    drawDock(c);
    drawDrag(c);
    drawFx(c);
  }

  /* =====================================================================
   * Calque d'effets (au-dessus du HUD)
   * ===================================================================== */
  function drawComboCounter(c) {
    if (state.combo < 2 || now > state.comboShowUntil) return;
    const fade = state.comboShowUntil === Infinity ? 1 : clamp((state.comboShowUntil - now) / 400, 0, 1);
    const pop = 1 + 0.6 * (1 - easeOutCubic(clamp((now - state.comboPopAt) / 280, 0, 1)));
    const col = comboColor(state.combo);
    const size = Math.min(L.hex * 1.25, 64) * (1 + Math.min(state.combo, 12) * 0.03);
    const y = (gaugeRect ? gaugeRect.bottom : 60) + size * 0.75 + 10;
    c.save();
    c.globalAlpha = fade;
    c.translate(W / 2, y);
    c.rotate(Math.sin(now / 90) * 0.035 * Math.min(1, state.combo / 6));
    c.scale(pop, pop);
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.lineJoin = 'round';
    c.strokeStyle = 'rgba(20, 10, 40, 0.85)';

    c.font = `900 ${Math.round(size * 0.32)}px ${FONT}`;
    c.lineWidth = size * 0.08;
    c.strokeText('COMBO', 0, -size * 0.58);
    c.fillStyle = '#ffffff';
    c.fillText('COMBO', 0, -size * 0.58);

    c.font = `900 ${Math.round(size)}px ${FONT}`;
    c.lineWidth = size * 0.14;
    c.strokeText('×' + state.combo, 0, size * 0.08);
    c.shadowColor = col;
    c.shadowBlur = save.lowFx ? 0 : 18 + 8 * Math.sin(now / 80);
    c.fillStyle = col;
    c.fillText('×' + state.combo, 0, size * 0.08);
    c.shadowBlur = 0;

    const sub = 'points ×' + comboMult() * (state.feverOn ? 2 : 1) + (state.feverOn ? '  🔥' : '');
    c.font = `800 ${Math.round(size * 0.28)}px ${FONT}`;
    c.lineWidth = size * 0.07;
    c.strokeText(sub, 0, size * 0.74);
    c.fillStyle = '#ffe9a8';
    c.fillText(sub, 0, size * 0.74);
    c.restore();
  }

  function drawBanners(c) {
    for (let i = banners.length - 1; i >= 0; i--) {
      const b = banners[i];
      const t = (now - b.t0) / b.dur;
      if (t >= 1) { banners.splice(i, 1); continue; }
      const sIn = t < 0.18 ? easeOutBack(t / 0.18) : 1;
      const size = Math.min(W * 0.11, 58) * b.size;
      c.save();
      c.globalAlpha = t > 0.75 ? 1 - (t - 0.75) / 0.25 : 1;
      c.translate(W / 2, H * 0.42 + i * size * 1.15 - t * 30);
      c.rotate(-0.06);
      c.scale(sIn, sIn);
      c.font = `900 ${Math.round(size)}px ${FONT}`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.lineJoin = 'round';
      c.lineWidth = size * 0.16;
      c.strokeStyle = 'rgba(20, 10, 40, 0.9)';
      c.strokeText(b.text, 0, 0);
      c.shadowColor = b.color;
      c.shadowBlur = save.lowFx ? 0 : 24;
      c.fillStyle = b.color;
      c.fillText(b.text, 0, 0);
      c.restore();
    }
  }

  function drawOverlay() {
    const c = fctx;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.clearRect(0, 0, W, H);

    // Cadre arc-en-ciel pendant la fièvre
    if (state.feverOn) {
      const hue = (now / 6) % 360;
      c.save();
      c.lineWidth = 10 + 4 * Math.sin(now / 120);
      c.strokeStyle = `hsla(${hue}, 95%, 62%, 0.55)`;
      c.shadowColor = `hsla(${hue}, 95%, 62%, 1)`;
      c.shadowBlur = save.lowFx ? 0 : 24;
      c.strokeRect(0, 0, W, H);
      c.restore();
    }

    // Orbes en route vers la jauge, avec traînée
    c.save();
    c.globalCompositeOperation = 'lighter';
    const r = L.hex * 0.16;
    for (const o of orbs) {
      if (now < o.t0) continue;
      const P = PALETTE[o.color];
      c.fillStyle = P.top;
      for (let j = 0; j < o.trail.length; j++) {
        const q = o.trail[j];
        const k = (j + 1) / o.trail.length;
        c.globalAlpha = 0.35 * k;
        c.beginPath();
        c.arc(q.x, q.y, r * k, 0, Math.PI * 2);
        c.fill();
      }
      c.globalAlpha = 1;
      const g = c.createRadialGradient(o.x, o.y, 0, o.x, o.y, r * 2.4);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.35, P.light);
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      c.fillStyle = g;
      c.beginPath();
      c.arc(o.x, o.y, r * 2.4, 0, Math.PI * 2);
      c.fill();
    }
    c.restore();

    drawParticleList(c, topParticles);
    drawComboCounter(c);
    drawBanners(c);

    if (state.flash) {
      const t = (performance.now() - state.flash.t0) / state.flash.dur;
      if (t >= 1) {
        state.flash = null;
      } else {
        c.save();
        c.globalAlpha = 0.5 * (1 - t);
        c.fillStyle = state.flash.color;
        c.fillRect(0, 0, W, H);
        c.restore();
      }
    }
  }

  /* =====================================================================
   * HUD
   * ===================================================================== */
  let hudCache = '';
  function updateHud(dt) {
    const delta = state.score - state.displayScore;
    state.displayScore += delta * Math.min(1, dt * 5);
    if (Math.abs(delta) < 0.5) state.displayScore = state.score;
    const shown = Math.round(state.displayScore);

    // Niveaux : « Normal 12 » + score / objectif. Modes spéciaux : compteur propre au mode + record.
    let label, num, txt, pct, danger = false;
    if (!isSpecial()) {
      label = diff().name;
      num = state.level;
      txt = `${shown} / ${state.goal}`;
      pct = shown / state.goal;
    } else {
      const m = rules();
      label = m.short;
      const best = save.special[state.mode].best;
      // Le record n'est enregistré qu'en fin de partie : on signale tout de suite quand on le dépasse
      txt = shown > best && best > 0 ? `${shown} · nouveau record !`
        : shown > best ? `${shown} · premier record` : `${shown} · record ${best}`;
      if (m.moves) {
        num = state.movesLeft;
        pct = state.movesLeft / m.moves;
        danger = state.movesLeft <= 3 && !state.over;
      } else if (state.mode === 'chrono') {
        num = Math.ceil(state.timeLeft / 1000);
        pct = state.timeLeft / (m.time * 1000);
        danger = state.timeLeft <= 10000 && !state.over;
      } else {
        num = state.turn;
        // La jauge se remplit jusqu'au prochain rocher et passe au rouge juste avant sa chute
        const left = state.nextRockTurn - state.turn;
        pct = 1 - left / rockInterval(state.turn);
        danger = left <= 1 && !state.over;
      }
    }
    const key = [label, num, txt, Math.round(pct * 200), danger].join('|');
    if (key === hudCache) return;
    hudCache = key;
    $('diffName').textContent = label;
    $('lvlNum').textContent = num;
    $('progTxt').textContent = txt;
    $('progFill').style.width = clamp(pct * 100, 0, 100) + '%';
    $('progBox').classList.toggle('danger', danger);
  }

  /** Chrono : le temps file hors accueil et hors fenêtres ; à zéro, la partie se termine après la cascade en cours. */
  function updateChrono(realDt) {
    if (state.mode !== 'chrono' || state.over || state.homeOpen || state.modalOpen || state.timeLeft <= 0) return;
    const before = state.timeLeft;
    state.timeLeft = Math.max(0, state.timeLeft - realDt * timeScale);
    if (state.timeLeft <= 10000 && Math.ceil(before / 1000) !== Math.ceil(state.timeLeft / 1000)) {
      Sfx.tone(state.timeLeft < 5000 ? 1200 : 900, 0.05, 'square', 0.04);
    }
    if (state.timeLeft > 0) return;
    if (drag && !drag.ret) {
      drag.target = null;
      drag.ret = { t0: now, fx: drag.x, fy: drag.y };
    }
    if (!state.busy) endSpecial('time');
  }

  /* =====================================================================
   * Boucle principale
   * ===================================================================== */
  let lastT = performance.now();
  function loop(t) {
    const realDt = Math.min(50, Math.max(0, t - lastT));
    lastT = t;
    // Ralenti : le temps du jeu glisse vers SLOWMO_SCALE puis revient à 1
    const targetScale = performance.now() < state.slowUntil ? SLOWMO_SCALE : 1;
    timeScale += (targetScale - timeScale) * Math.min(1, realDt / 60);
    now += realDt * timeScale;
    const dt = (realDt / 1000) * timeScale;

    gaugeRect = $('progBar').getBoundingClientRect();
    runTimers();
    updateChrono(realDt);
    updateFlyers();
    updateOrbs();
    updateFx(dt);
    if (drag && drag.ret && now - drag.ret.t0 >= RETURN_DURATION) drag = null;
    updateHud(realDt / 1000);
    render();
    drawOverlay();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 150));

  buildBoard();
  Sfx.muted = save.muted;
  $('diffName').textContent = diff().name;
  $('gameVersion').textContent = 'v' + GAME_VERSION;
  renderSoundIcon();
  layout();
  // Le plateau de la partie sauvegardée (ou du dernier niveau débloqué) s'anime derrière l'accueil
  if (prog().game) restoreGame(prog().game); else startLevel(prog().unlocked, false);
  showHome();
  requestAnimationFrame(loop);
})();
</script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* hors ligne indisponible : le jeu marche quand même */ });
  }
</script></body>
</html>
