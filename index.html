<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140e30">
<title>Hexa Sort V5.6</title>
<style>
  :root {
    --glass: rgba(255, 255, 255, 0.10);
    --glass-border: rgba(255, 255, 255, 0.18);
    --accent: #ffd84d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #140e30; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  button { font: inherit; color: inherit; border: none; background: none; margin: 0; }
  #game { position: fixed; inset: 0; display: block; touch-action: none; }

  /* ---------- HUD supérieur ---------- */
  #hud {
    position: fixed; z-index: 5;
    top: calc(env(safe-area-inset-top, 0px) + 10px); left: 12px; right: 12px;
    max-width: 560px; margin: 0 auto;
    display: flex; align-items: center; gap: 8px;
  }
  .pill {
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }
  #lvlBox { padding: 5px 12px; text-align: center; line-height: 1.05; min-width: 66px; }
  #lvlBox small { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  #lvlBox b { font-size: 22px; }
  #progBox { flex: 1; min-width: 0; padding: 7px 12px; }
  #progTop { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 5px; }
  #progTop span:first-child { opacity: .75; }
  #progBar { height: 12px; border-radius: 8px; background: rgba(0, 0, 0, 0.35); overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.4); }
  #progFill {
    height: 100%; width: 0%; border-radius: 8px;
    background: linear-gradient(90deg, #ffb83d, #ffe066);
    box-shadow: 0 0 12px rgba(255, 216, 77, 0.7);
  }
  .iconBtn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .iconBtn svg { width: 22px; height: 22px; }
  .iconBtn:active { transform: scale(0.92); }

  /* ---------- Outils inférieurs ---------- */
  #tools {
    position: fixed; z-index: 5; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex; justify-content: center; gap: 26px; pointer-events: none;
  }
  .tool {
    pointer-events: auto; position: relative; width: 62px; height: 62px; border-radius: 20px;
    display: grid; place-items: center; cursor: pointer;
    border: 1px solid var(--glass-border);
    background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.06));
    box-shadow: 0 6px 0 rgba(0,0,0,.30), 0 10px 20px rgba(0,0,0,.25);
    transition: transform .1s, opacity .2s, background .2s;
  }
  .tool svg { width: 30px; height: 30px; }
  .tool .lbl { position: absolute; bottom: -19px; font-size: 11px; font-weight: 700; opacity: .85; white-space: nowrap; }
  .tool .badge {
    position: absolute; top: -7px; right: -7px; min-width: 22px; height: 22px; padding: 0 5px;
    border-radius: 11px; background: #ff4d6d; border: 2px solid #fff;
    font-size: 12px; font-weight: 800; display: grid; place-items: center;
  }
  .tool:active { transform: translateY(3px); }
  .tool.active {
    background: linear-gradient(180deg, #ffd84d, #f59e0b); color: #3b2300;
    box-shadow: 0 0 0 3px rgba(255,216,77,.5), 0 6px 0 rgba(0,0,0,.3);
  }
  .tool:disabled { opacity: .4; cursor: default; }

  #hint {
    position: fixed; z-index: 6; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 72px);
    transform: translateX(-50%) translateY(-8px); opacity: 0; pointer-events: none;
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
    background: rgba(255, 77, 109, 0.92); box-shadow: 0 6px 18px rgba(0,0,0,.3);
    transition: opacity .2s, transform .2s; white-space: nowrap;
  }
  #hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Modales ---------- */
  #modal {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(10, 6, 30, 0.6);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #modal.show { opacity: 1; pointer-events: auto; }
  .card {
    width: min(340px, 100%); text-align: center; padding: 26px 22px 22px; border-radius: 26px;
    background: linear-gradient(180deg, #3b2c86, #221858);
    border: 1px solid rgba(255,255,255,.2);
    box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25);
    transform: scale(.85) translateY(20px); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1);
  }
  #modal.show .card { transform: scale(1) translateY(0); }
  #mIcon { font-size: 54px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  #mTitle { margin: 12px 0 6px; font-size: 26px; font-weight: 900; letter-spacing: .01em; }
  #mText { margin: 0 0 20px; font-size: 15px; opacity: .85; line-height: 1.45; }
  #mBtns { display: flex; flex-direction: column; gap: 10px; }
  .mBtn {
    padding: 13px 18px; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    box-shadow: 0 4px 0 rgba(0,0,0,.3);
  }
  .mBtn.primary {
    background: linear-gradient(180deg, #ffe066, #f59e0b); color: #3b2300; border: none;
    box-shadow: 0 4px 0 #b45309, 0 8px 18px rgba(245,158,11,.35);
  }
  .mBtn:active { transform: translateY(2px); }

  /* ---------- Effets V2 ---------- */
  #fx { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
  #progBox.bump { animation: gaugeBump .22s ease-out; }
  @keyframes gaugeBump {
    0% { transform: scale(1); }
    40% { transform: scale(1.05); box-shadow: 0 0 26px rgba(255, 216, 77, 0.65); }
    100% { transform: scale(1); }
  }
  body.fever #progFill {
    background: linear-gradient(90deg, #ff6bd5, #ffd84d, #67e8f9, #c084fc, #ff6bd5);
    background-size: 200% 100%;
    animation: feverBar .9s linear infinite;
  }
  @keyframes feverBar { from { background-position: 0 0; } to { background-position: 200% 0; } }

  /* Petits écrans : le 4e bouton du HUD laisse moins de place à la jauge */
  @media (max-width: 420px) {
    #hud { gap: 6px; left: 8px; right: 8px; }
    #hud .iconBtn { width: 40px; height: 40px; }
    #lvlBox { min-width: 54px; padding: 5px 8px; }
    #progTop span:first-child { display: none; }
    #progTop { justify-content: center; }
  }

  /* ---------- Accueil & niveaux (V3) ---------- */
  #home {
    position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: radial-gradient(circle at 50% 30%, rgba(59, 43, 128, 0.88), rgba(12, 8, 32, 0.94));
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  #home.show { opacity: 1; pointer-events: auto; }
  .homeCard {
    display: flex; flex-direction: column;
    width: min(420px, 100%); max-height: 100%; overflow: hidden; text-align: center;
    padding: 22px 18px 18px; border-radius: 28px;
    background: linear-gradient(180deg, rgba(59, 44, 134, 0.92), rgba(34, 24, 88, 0.92));
    border: 1px solid rgba(255,255,255,.2);
    box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25);
    transform: translateY(16px) scale(.97); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1);
  }
  #home.show .homeCard { transform: none; }
  .homeLogo { width: 72px; height: 72px; margin: 0 auto; flex: none; filter: drop-shadow(0 8px 14px rgba(0,0,0,.4)); }
  .homeCard > * { flex: none; }
  /* Seule la grille des niveaux défile : le choix de difficulté reste visible */
  /* Onglets Niveaux / Modes spéciaux : seul le contenu de l'onglet défile */
  #homeTabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 0 12px; }
  .homeTab {
    padding: 10px 6px; border-radius: 14px; font-weight: 900; font-size: 14px; cursor: pointer;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .homeTab.active { background: rgba(255, 216, 77, 0.16); border-color: var(--accent); color: var(--accent); }
  .panel { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }
  .panel.show { display: flex; }
  .panel > * { flex: none; }
  .panel > .gridWrap {
    flex: 1 1 auto; min-height: 140px; overflow-y: auto; position: relative;
    margin: 0 -6px; padding: 2px 6px 4px;
  }
  #panelModes { overflow-y: auto; margin: 0 -6px; padding: 2px 6px 4px; }
  .modeCard {
    display: grid; grid-template-columns: 46px 1fr; gap: 3px 12px; align-items: center;
    width: 100%; margin-bottom: 10px; padding: 12px; border-radius: 18px; text-align: left; cursor: pointer;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.2); box-shadow: 0 4px 0 rgba(0,0,0,.3);
  }
  .modeCard:active { transform: translateY(2px); }
  .modeCard .mi { grid-row: span 2; font-size: 32px; text-align: center; }
  .modeCard .mn { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 900; font-size: 16px; }
  .modeCard .mr { font-size: 12px; font-weight: 800; color: var(--accent); white-space: nowrap; }
  .modeCard .md { font-size: 12px; opacity: .8; line-height: 1.35; }
  .modeCard .live { margin-left: 6px; padding: 2px 6px; border-radius: 8px; background: #ff4d6d; font-size: 10px; vertical-align: middle; }
  #progBox.danger { animation: dangerPulse .5s ease-in-out infinite alternate; }
  #progBox.danger #progFill { background: linear-gradient(90deg, #ff4d6d, #ff9a3c); box-shadow: 0 0 12px rgba(255, 77, 109, .8); }
  @keyframes dangerPulse { to { box-shadow: 0 0 0 2px rgba(255, 77, 109, .85), 0 0 18px rgba(255, 77, 109, .6); } }
  body.noTools #tools { display: none; }
  .homeCard h1 { margin: 6px 0 2px; font-size: 34px; font-weight: 900; letter-spacing: .02em; }
  .homeCard h1 span { color: var(--accent); }
  .homeCard h1 .ver {
    display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 10px; vertical-align: middle;
    font-size: 13px; font-weight: 800; letter-spacing: .04em; color: #fff;
    background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.25);
  }
  .tag { margin: 0 0 16px; font-size: 13px; opacity: .75; }
  #btnPlay { width: 100%; }
  #diffBar {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 0 0 8px;
    padding: 4px; border-radius: 16px; background: rgba(0, 0, 0, 0.25);
  }
  .diffBtn {
    padding: 8px 2px; border-radius: 12px; font-size: 12px; font-weight: 800; cursor: pointer;
    opacity: .75; line-height: 1.2;
  }
  .diffBtn .lv { display: block; font-size: 10px; font-weight: 700; opacity: .8; }
  .diffBtn.active {
    opacity: 1; color: #3b2300;
    background: linear-gradient(180deg, #ffe066, #f59e0b); box-shadow: 0 3px 0 #b45309;
  }
  .diffDesc { margin: 0 0 14px; font-size: 12px; opacity: .8; min-height: 2.5em; }
  .homeInfo { margin: 10px 0 14px; font-size: 12px; opacity: .7; }
  .secTitle { margin: 4px 0 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; font-weight: 800; }
  #levelGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 10px; }
  .lvlTile {
    aspect-ratio: 1; border-radius: 18px; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
    border: 1px solid rgba(255,255,255,.2); box-shadow: 0 4px 0 rgba(0,0,0,.3);
  }
  .lvlTile b { font-size: 22px; font-weight: 900; line-height: 1; }
  .lvlTile .stars { font-size: 11px; letter-spacing: 1px; color: #ffd84d; }
  .lvlTile.current { border: 2px solid var(--accent); box-shadow: 0 0 0 3px rgba(255,216,77,.3), 0 4px 0 rgba(0,0,0,.3); }
  .lvlTile.locked { opacity: .4; cursor: default; box-shadow: none; }
  .lvlTile.locked .stars { color: #fff; opacity: .8; }
  .lvlTile:not(.locked):active { transform: translateY(2px); }
  .worldTitle {
    grid-column: 1 / -1; margin: 8px 0 0; padding: 6px 0 2px; text-align: left;
    font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--accent);
    border-bottom: 1px solid rgba(255, 216, 77, 0.25);
  }
  .worldTitle:first-child { margin-top: 0; }
  .homeFoot { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
  .homeFoot .mBtn { font-size: 12px; padding: 10px 6px; line-height: 1.2; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hexa Sort"></head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<div id="hud">
  <div id="lvlBox" class="pill"><small id="diffName">Normal</small><b id="lvlNum">1</b></div>
  <div id="progBox" class="pill">
    <div id="progTop"><span>Objectif</span><span id="progTxt">0 / 500</span></div>
    <div id="progBar"><div id="progFill"></div></div>
  </div>
  <button id="btnHome" class="iconBtn pill" aria-label="Accueil et niveaux">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
  </button>
  <button id="btnSound" class="iconBtn pill" aria-label="Son activé / coupé"></button>
  <button id="btnRestart" class="iconBtn pill" aria-label="Recommencer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
  </button>
</div>

<div id="hint">Touchez une pile à détruire</div>

<div id="tools">
  <button id="btnHammer" class="tool" aria-label="Marteau">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 8.5 4 19a1.4 1.4 0 0 0 2 2L16.5 10.5"/>
      <path d="M12.5 6.5 16 3l5 5-3.5 3.5z" fill="currentColor" fill-opacity=".25"/>
    </svg>
    <span class="badge" id="hammerCount">3</span><span class="lbl">Marteau</span>
  </button>
  <button id="btnReroll" class="tool" aria-label="Relancer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/>
      <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/>
    </svg>
    <span class="badge" id="rerollCount">3</span><span class="lbl">Relancer</span>
  </button>
</div>

<div id="home">
  <div class="homeCard">
    <svg class="homeLogo" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,62 80,70 80,80 50,88 20,80 20,70" fill="#14317a"/>
      <polygon points="50,46 80,54 80,70 50,78 20,70 20,54" fill="#2459c7"/>
      <polygon points="50,38 80,46 50,54 20,46" fill="#3d8bff"/>
      <polygon points="50,24 80,32 80,42 50,50 20,42 20,32" fill="#d4621a"/>
      <polygon points="50,16 80,24 50,32 20,24" fill="#ff8a2b"/>
      <polygon points="50,6 78,13 78,20 50,27 22,20 22,13" fill="#7a35d1"/>
      <polygon points="50,2 78,9 50,16 22,9" fill="#a65cff"/>
    </svg>
    <h1>Hexa <span>Sort</span><small class="ver" id="gameVersion"></small></h1>
    <p class="tag">Trie, enchaîne, explose.</p>
    <div id="homeTabs" role="tablist" aria-label="Type de partie">
      <button id="tabLevels" class="homeTab active" role="tab">🗺️ Niveaux</button>
      <button id="tabModes" class="homeTab" role="tab">⚡ Modes spéciaux</button>
    </div>
    <div id="panelLevels" class="panel show">
      <div id="diffBar" role="tablist" aria-label="Difficulté"></div>
      <p id="diffDesc" class="diffDesc"></p>
      <button id="btnPlay" class="mBtn primary">Jouer</button>
      <p class="homeInfo" id="homeInfo"></p>
      <div class="secTitle">Niveaux</div>
      <div class="gridWrap" id="gridWrap"><div id="levelGrid"></div></div>
    </div>
    <div id="panelModes" class="panel">
      <div id="modeList"></div>
    </div>
    <div class="homeFoot">
      <button id="homeSound" class="mBtn"></button>
      <button id="homeTools" class="mBtn"></button>
      <button id="homeFx" class="mBtn"></button>
      <button id="btnResetProgress" class="mBtn">Effacer la progression</button>
    </div>
  </div>
</div>

<div id="modal">
  <div class="card">
    <div id="mIcon"></div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div id="mBtns"></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =====================================================================
   * Constantes
   * ===================================================================== */
  const ISO_SCALE_Y = 0.80;          // écrasement vertical (vue inclinée)
  const COLLECT_THRESHOLD = 10;      // collecte à 10+ jetons identiques
  const DOCK_MAX_RUN = 3;            // piles du dock : au plus 3 jetons de la même couleur à la suite
  const POINTS_PER_TOKEN = 10;
  const TOKEN_BASE_H = 6;            // épaisseur d'un jeton (px à taille de référence)
  const FLY_DURATION = 380;
  const FLY_STAGGER = 75;
  const RETURN_DURATION = 180;
  const HEX_SIN = Math.sin(Math.PI / 3);
  const SQRT3 = Math.sqrt(3);
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  // Version du jeu : affichée sur l'accueil et lue par android/build-apk.ps1 pour numéroter l'APK.
  // À changer à chaque nouvelle version (une seule source de vérité).
  const GAME_VERSION = '5.6';
  const SLOWMO_SCALE = 0.3;          // vitesse du temps pendant un ralenti
  const FEVER_AT = 5;                // combo qui déclenche la fièvre
  const FEVER_TURNS = 3;             // coups joués en fièvre (points ×2)
  const COMBO_COLORS = ['#ffffff', '#ffe066', '#ffb347', '#ff6b9d', '#c084fc', '#67e8f9'];

  // top = face supérieure, light = reflet du dégradé, side/sideDark = tranche 3D, edge = biseau
  const PALETTE = [
    { key: 'blue',   name: 'Bleu',   top: '#3d8bff', light: '#b8d6ff', side: '#2459c7', sideDark: '#12307a', edge: '#1b4fb8' },
    { key: 'green',  name: 'Vert',   top: '#2ecc71', light: '#bdf7d4', side: '#1f9952', sideDark: '#0d5a2e', edge: '#178a47' },
    { key: 'orange', name: 'Orange', top: '#ff8a2b', light: '#ffd6ad', side: '#d4621a', sideDark: '#84360a', edge: '#c25512' },
    { key: 'purple', name: 'Violet', top: '#a65cff', light: '#e5ccff', side: '#7a35d1', sideDark: '#441983', edge: '#6f2dc2' },
    { key: 'yellow', name: 'Jaune',  top: '#ffd23f', light: '#fff4b8', side: '#d9a514', sideDark: '#876205', edge: '#c79410' },
    { key: 'red',    name: 'Rouge',  top: '#ff4757', light: '#ffc6cc', side: '#d1263a', sideDark: '#7c0e1c', edge: '#bf1e31' },
  ];
  const PLATE = { key: 'plate', top: '#363b73', light: '#4b5194', side: '#22254b', sideDark: '#12142b', edge: '#555ca3' };
  const ROCK_HARD = { key: 'rockHard', top: '#3d4052', light: '#6b6f86', side: '#272936', sideDark: '#15161e', edge: '#9ca0b8' };
  const ROCK = { key: 'rock', top: '#6b6f86', light: '#a3a7bf', side: '#45485c', sideDark: '#272936', edge: '#8a8ea6' };

  /* =====================================================================
   * Utilitaires
   * ===================================================================== */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  // Hasard du jeu (plateau, dock) : reproductible en Défi du jour (graine = date), libre sinon.
  // Les effets visuels gardent Math.random pour ne jamais décaler la suite du défi.
  let rngState = 0;
  function seededRandom() { // mulberry32
    rngState = (rngState + 0x6D2B79F5) | 0;
    let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rand = () => (state.mode === 'daily' ? seededRandom() : Math.random());
  const randInt = (a, b) => a + Math.floor(rand() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];  // effets visuels
  const rpick = arr => arr[Math.floor(rand() * arr.length)];        // règles du jeu
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInOutQuad = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const easeInCubic = t => t * t * t;
  const $ = id => document.getElementById(id);

  const topColor = s => s[s.length - 1];
  function topRun(s) {
    if (!s.length) return 0;
    const c = s[s.length - 1];
    let n = 0;
    for (let i = s.length - 1; i >= 0 && s[i] === c; i--) n++;
    return n;
  }
  const isPure = s => s.length > 0 && topRun(s) === s.length;

  /* =====================================================================
   * Horloge & minuteurs synchronisés sur la boucle de rendu
   * ===================================================================== */
  // Horloge de jeu (ms) : elle avance moins vite pendant les ralentis.
  let now = 0;
  let timeScale = 1;
  const timers = [];
  function after(ms, fn) { timers.push({ t: now + ms, fn }); }
  function sleep(ms) { return new Promise(res => after(ms, res)); }
  function runTimers() {
    const t = now;
    const due = [];
    for (let i = timers.length - 1; i >= 0; i--) {
      if (timers[i].t <= t) { due.push(timers[i]); timers.splice(i, 1); }
    }
    due.sort((a, b) => a.t - b.t).forEach(x => x.fn());
  }

  /* =====================================================================
   * Audio synthétisé (Web Audio API)
   * ===================================================================== */
  const Sfx = {
    ctx: null, master: null, noiseBuf: null, muted: false,
    init() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    },
    ok() { return this.ctx && !this.muted && this.ctx.state !== 'closed'; },
    tone(freq, dur, type = 'sine', gain = 0.2, when = 0, endFreq = null) {
      if (!this.ok()) return;
      const c = this.ctx, t = c.currentTime + when;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.master);
      o.start(t); o.stop(t + dur + 0.05);
    },
    noise(dur, freq, gain, type = 'lowpass', when = 0, q = 0.7) {
      if (!this.ok()) return;
      const c = this.ctx, t = c.currentTime + when;
      const src = c.createBufferSource(); src.buffer = this.noiseBuf;
      const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(g).connect(this.master);
      src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
    },
    pick() { this.noise(0.09, 2200, 0.22, 'bandpass', 0, 1.2); this.tone(520, 0.06, 'sine', 0.06); },
    place() { this.noise(0.14, 700, 0.45); this.tone(150, 0.14, 'sine', 0.3, 0, 90); },
    // i = rang du saut dans toute la cascade : la mélodie grimpe tant que ça s'enchaîne
    jump(i) {
      const scale = [0, 2, 4, 7, 9];
      const n = Math.min(i, 17);
      const semis = scale[n % 5] + 12 * Math.floor(n / 5);
      const f = 262 * Math.pow(2, semis / 12);
      this.tone(f, 0.16, 'triangle', 0.15);
      this.tone(f * 2, 0.08, 'sine', 0.04);
    },
    land() { this.noise(0.04, 1500, 0.06, 'bandpass', 0, 2); },
    pop(i) { this.tone(620 + i * 45, 0.07, 'square', 0.035); this.noise(0.05, 3200, 0.08, 'highpass'); },
    chord(combo = 1) {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      if (combo >= 3) notes.push(1318.5);
      if (combo >= 5) notes.push(1568, 2093);
      notes.forEach((f, k) => this.tone(f, 0.75, 'triangle', 0.1, k * 0.035));
      this.tone(261.63, 0.8, 'sine', 0.14);
      if (combo >= 4) this.tone(130.81, 0.9, 'sawtooth', 0.05);
    },
    comboTick(n) {
      const steps = [0, 4, 7, 12, 16, 19, 24, 28, 31, 36];
      const f = 392 * Math.pow(2, steps[Math.min(n - 2, steps.length - 1)] / 12);
      this.tone(f, 0.12, 'square', 0.035);
      this.tone(f * 1.5, 0.2, 'triangle', 0.05, 0.04);
    },
    orb(i) { this.tone(1318.5 * Math.pow(2, (i % 6) / 12), 0.06, 'sine', 0.045); },
    impact() { this.tone(70, 0.5, 'sine', 0.55, 0, 35); this.noise(0.4, 500, 0.5); },
    fever() {
      this.tone(180, 0.7, 'sawtooth', 0.06, 0, 1400);
      [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, k) => this.tone(f, 0.3, 'square', 0.04, 0.25 + k * 0.06));
      this.noise(0.5, 3000, 0.12, 'bandpass', 0.1, 0.8);
    },
    smash() { this.noise(0.3, 900, 0.65); this.tone(110, 0.3, 'sine', 0.5, 0, 45); },
    deal() { for (let i = 0; i < 3; i++) this.noise(0.05, 2600, 0.1, 'bandpass', i * 0.11, 1.5); },
    click() { this.tone(880, 0.05, 'sine', 0.08); },
    win() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, k) => this.tone(f, 0.45, 'triangle', 0.13, k * 0.1)); },
    lose() { [392, 329.6, 261.6, 196].forEach((f, k) => this.tone(f, 0.4, 'triangle', 0.13, k * 0.14)); },
  };

  /* =====================================================================
   * Canvas, layout responsive & devicePixelRatio
   * ===================================================================== */
  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  // Calque d'effets au-dessus du HUD (orbes vers la jauge, compteur de combo, bannières, flashs)
  const fxCanvas = $('fx');
  const fctx = fxCanvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  const L = { hex: 40, tile: 36, plateR: 39, th: 6, plateH: 7, boardCX: 0, boardCY: 0, dockY: 0, dockX: [0, 0, 0], dockScale: 0.78 };
  let bgGrad = null, glowGrad = null;
  const gradCache = new Map();

  function axialToPixel(q, r) {
    const s = L.hex;
    return {
      x: L.boardCX + s * 1.5 * q,
      y: L.boardCY + s * SQRT3 * (r + q / 2) * ISO_SCALE_Y,
    };
  }

  function layout() {
    // Effets réduits : rendu en résolution plus basse (le plus gros gain sur les téléphones modestes)
    DPR = Math.min(window.devicePixelRatio || 1, save.lowFx ? 1.25 : 3);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    fxCanvas.width = canvas.width;
    fxCanvas.height = canvas.height;
    fxCanvas.style.width = W + 'px';
    fxCanvas.style.height = H + 'px';

    const topLimit = $('hud').getBoundingClientRect().bottom + 6;
    // Barre d'outils masquée (préférence « Sans outils ») : son rectangle vaut 0,
    // on prend alors le bas de l'écran au lieu de réduire le plateau à presque rien.
    const toolsRect = $('tools').getBoundingClientRect();
    const bottomLimit = (toolsRect.height > 0 ? toolsRect.top : H - 16) - 8;
    const avail = Math.max(200, bottomLimit - topLimit);
    // Dimensions en unités de « s » (rayon d'une case), selon le rayon du plateau :
    // demi-hauteur du plateau, marge pour les piles au-dessus, place du dock en dessous.
    const R = gridRadius;
    const half = (R * SQRT3 + 0.87) * ISO_SCALE_Y;
    L.dockScale = R >= 4 ? 1 : 0.78;           // grand plateau = cases plus petites : dock moins réduit
    const topUnits = half + 0.95;
    const dockUnits = half + 2.45 + (L.dockScale - 0.78) * 2;
    const blockUnits = topUnits + dockUnits + 0.6;
    const s = clamp(Math.min((W - 20) / (3 * R + 1.6), avail / blockUnits), 14, 58);

    L.hex = s;
    L.tile = s * 0.9;
    L.plateR = s * 0.97;
    L.th = TOKEN_BASE_H * clamp(s / 38, 0.65, 1.3);
    L.plateH = s * 0.18;
    const off = Math.max(0, (avail - blockUnits * s) / 2);
    L.boardCX = W / 2;
    L.boardCY = topLimit + off + topUnits * s;
    L.dockY = L.boardCY + dockUnits * s;
    const spacing = Math.min(W / 3.2, s * 3.3);
    L.dockX = [W / 2 - spacing, W / 2, W / 2 + spacing];

    for (const c of state.cells) {
      const p = axialToPixel(c.q, c.r);
      c.cx = p.x; c.cy = p.y;
    }
    // Painter's algorithm : ordre de dessin par Y croissant (puis X)
    state.drawOrder = state.cells.slice().sort((a, b) => (a.cy - b.cy) || (a.cx - b.cx));

    gradCache.clear();
    bgGrad = ctx.createRadialGradient(W / 2, H * 0.38, 0, W / 2, H * 0.38, Math.max(W, H) * 0.85);
    bgGrad.addColorStop(0, '#3b2b80');
    bgGrad.addColorStop(0.55, '#1c1445');
    bgGrad.addColorStop(1, '#0c0820');
    glowGrad = ctx.createRadialGradient(L.boardCX, L.boardCY, 0, L.boardCX, L.boardCY, s * (2 * R + 0.5));
    glowGrad.addColorStop(0, 'rgba(140, 120, 255, 0.22)');
    glowGrad.addColorStop(1, 'rgba(140, 120, 255, 0)');
  }

  /* =====================================================================
   * Primitives de dessin 2.5D
   * ===================================================================== */
  function hexPath(c, r, x = 0, y = 0) {
    c.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = (Math.PI / 3) * k;
      const px = x + Math.cos(a) * r;
      const py = y + Math.sin(a) * r * ISO_SCALE_Y;
      if (k) c.lineTo(px, py); else c.moveTo(px, py);
    }
    c.closePath();
  }

  function topGrad(P, r) {
    const k = P.key + 't' + r.toFixed(2);
    let g = gradCache.get(k);
    if (!g) {
      g = ctx.createLinearGradient(-r * 0.7, -r * 0.7 * ISO_SCALE_Y, r * 0.6, r * 0.8 * ISO_SCALE_Y);
      g.addColorStop(0, P.light);
      g.addColorStop(0.42, P.top);
      g.addColorStop(1, P.top);
      gradCache.set(k, g);
    }
    return g;
  }

  function sideGrad(P, r) {
    const k = P.key + 's' + r.toFixed(2);
    let g = gradCache.get(k);
    if (!g) {
      g = ctx.createLinearGradient(-r, 0, r, 0);
      g.addColorStop(0, P.side);
      g.addColorStop(0.5, P.side);
      g.addColorStop(1, P.sideDark);
      gradCache.set(k, g);
    }
    return g;
  }

  /**
   * Dessine un jeton hexagonal extrudé.
   * (x, yBase) = centre de la face inférieure à l'écran ; la face supérieure est à yBase - th.
   */
  function drawToken(c, x, yBase, r, th, P, underside = false) {
    const hy = r * HEX_SIN * ISO_SCALE_Y;
    c.save();
    c.translate(x, yBase - th);

    // Tranche 3D (faces avant visibles)
    c.beginPath();
    c.moveTo(r, 0); c.lineTo(r * 0.5, hy); c.lineTo(-r * 0.5, hy); c.lineTo(-r, 0);
    c.lineTo(-r, th); c.lineTo(-r * 0.5, hy + th); c.lineTo(r * 0.5, hy + th); c.lineTo(r, th);
    c.closePath();
    c.fillStyle = sideGrad(P, r);
    c.fill();

    // Liseré de séparation entre couches
    c.beginPath();
    c.moveTo(-r, th); c.lineTo(-r * 0.5, hy + th); c.lineTo(r * 0.5, hy + th); c.lineTo(r, th);
    c.strokeStyle = 'rgba(0, 0, 0, 0.35)';
    c.lineWidth = 1;
    c.stroke();

    // Face supérieure
    hexPath(c, r);
    c.fillStyle = underside ? P.sideDark : topGrad(P, r);
    c.fill();
    c.lineWidth = Math.max(1, r * 0.05);
    c.strokeStyle = P.edge;
    c.stroke();

    // Biseau intérieur
    hexPath(c, r * 0.8);
    c.lineWidth = Math.max(1, r * 0.045);
    c.strokeStyle = 'rgba(255, 255, 255, 0.26)';
    c.stroke();

    c.restore();
  }

  function drawCount(c, x, y, n, r) {
    c.save();
    c.translate(x, y);
    c.scale(1, 0.92);
    c.font = `900 ${Math.round(r * 0.66)}px ${FONT}`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.lineJoin = 'round';
    c.lineWidth = Math.max(2, r * 0.15);
    c.strokeStyle = 'rgba(20, 10, 40, 0.8)';
    c.strokeText(String(n), 0, r * 0.03);
    c.fillStyle = '#fff';
    c.fillText(String(n), 0, r * 0.03);
    c.restore();
  }

  /** Dessine une pile complète, chaque jeton individuellement, puis le compteur du sommet. */
  function drawStack(c, x, yBase, stack, showCount = true) {
    for (let i = 0; i < stack.length; i++) {
      drawToken(c, x, yBase - i * L.th, L.tile, L.th, PALETTE[stack[i]]);
    }
    if (showCount && stack.length) {
      drawCount(c, x, yBase - stack.length * L.th, topRun(stack), L.tile);
    }
  }

  /* =====================================================================

  const SAVE_KEY = 'hexa-sort-v5';

  const isColorList = s => Array.isArray(s) && s.every(x => Number.isInteger(x) && x >= 0 && x < PALETTE.length);
  function validGame(g, radius) {
    return !!g && Number.isInteger(g.level) && g.level >= 1 &&
      Array.isArray(g.cells) && g.cells.length === cellCountFor(radius) && g.cells.every(isColorList) &&
      Array.isArray(g.dock) && g.dock.length === 3 && g.dock.every(s => s === null || isColorList(s));

  const freshProgress = () => ({ unlocked: 1, best: {}, game: null });

    return {
      unlocked: Math.max(1, Math.floor(Number(p.unlocked)) || 1),
      best: p.best && typeof p.best === 'object' ? p.best : {},
      game: validGame(p.game, radius) ? p.game : null,

  function readJSON(key) {

  function cleanSpecial(p) {
    const o = { best: 0, bestCombo: 0, plays: 0, game: null, date: '' };
    if (!p || typeof p !== 'object') return o;

    o.bestCombo = Math.max(0, Math.floor(Number(p.bestCombo)) || 0);

    o.game = validGame(p.game, 3) ? p.game : null;

  function loadSave() {
    const out = { v: 3, muted: false, noTools: false, lowFx: false, current: 'normal', progress: {}, special: {} };
    // V5 d'abord, sinon reprise de la V4 (même format, sans modes spéciaux)
